<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dnachem-min architecture explorer</title>
<style>
  :root { --bg:#f7f8fa; --fg:#1d2330; --muted:#5b6475; --line:#b9c0cc; --card:#fff;
          --accent:#1f6feb; --review:#c27800; --sel:#e6f0ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px 0; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 2px; font-size:20px; }
  header p { margin:0 0 10px; color:var(--muted); }
  nav { display:flex; gap:4px; }
  nav button { border:1px solid var(--line); border-bottom:none; background:#eef0f4; padding:7px 16px;
               border-radius:6px 6px 0 0; font:inherit; cursor:pointer; color:var(--fg); }
  nav button[aria-selected="true"] { background:var(--bg); font-weight:600; color:var(--accent); }
  main { display:flex; align-items:flex-start; }
  #stage { flex:1; overflow:auto; padding:16px; min-width:0; }
  #detail { width:380px; flex:none; position:sticky; top:0; max-height:100vh; overflow:auto;
            background:var(--card); border-left:1px solid var(--line); padding:16px 18px; }
  #detail.empty { color:var(--muted); }
  .lane-title { font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em; fill:var(--muted); }
  .lane-bg { fill:#fff; stroke:var(--line); }
  .node rect { fill:var(--card); stroke:var(--line); stroke-width:1.2; rx:6; }
  .node:hover rect, .node:focus rect { stroke:var(--accent); }
  .node.sel rect { fill:var(--sel); stroke:var(--accent); stroke-width:2; }
  .node.review rect { stroke:var(--review); stroke-dasharray:4 3; }
  .node text { font-size:12.5px; fill:var(--fg); pointer-events:none; }
  .node { cursor:pointer; outline:none; }
  .edge { fill:none; stroke:#9aa4b5; stroke-width:1.2; opacity:.55; }
  .edge.hi { stroke:var(--accent); opacity:1; stroke-width:2; }
  h2 { margin:0 0 6px; font-size:18px; }
  h3 { margin:16px 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  details { margin-top:14px; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fafbfc; }
  summary { cursor:pointer; font-weight:600; }
  ul.files { list-style:none; padding:0; margin:8px 0 0; }
  ul.files li { display:flex; gap:6px; align-items:center; margin:3px 0; }
  ul.files a { color:var(--accent); word-break:break-all; font:12.5px ui-monospace, Consolas, monospace; }
  button.copy { border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; font-size:11px; padding:1px 6px; }
  code { font:12.5px ui-monospace, Consolas, monospace; background:#eef0f4; padding:1px 4px; border-radius:3px; }
  .badge { display:inline-block; background:#fff3d6; color:var(--review); border:1px solid #f0d28a;
           border-radius:10px; padding:1px 8px; font-size:12px; margin-bottom:6px; }
  .placeholder { color:var(--muted); padding:30px 10px; }
  .legend { font-size:12.5px; color:var(--muted); margin:0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>dnachem-min architecture explorer</h1>
  <p>Click a box to see what it does, in plain language, and where it lives in the code.</p>
  <nav role="tablist" id="tabs"></nav>
</header>
<main>
  <section id="stage" role="tabpanel"></section>
  <aside id="detail" class="empty" aria-live="polite">Select a box to see its description.</aside>
</main>
<script>
const DATA = /*__ARCHITECTURE_JSON__*/null;

(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const stage = document.getElementById('stage');
  const detail = document.getElementById('detail');
  const tabsEl = document.getElementById('tabs');
  // Links are relative to docs/explorer/index.html; repo files sit two levels up.
  const REPO = '../../';

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    }
    for (const c of children || []) e.appendChild(c);
    return e;
  }
  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- detail panel (shared by all views) ----
  function fileList(files) {
    const ul = el('ul', { class: 'files' });
    for (const f of files) {
      const path = f.split('#')[0];
      const a = el('a', { href: REPO + f, text: f, target: '_blank', rel: 'noopener' });
      const btn = el('button', { class: 'copy', type: 'button', text: 'copy', title: 'Copy path' });
      btn.addEventListener('click', function () {
        const done = function () { btn.textContent = 'copied'; setTimeout(function () { btn.textContent = 'copy'; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(path).then(done, done);
        else done();
      });
      ul.appendChild(el('li', {}, [btn, a]));
    }
    return ul;
  }
  function showDetail(item, laneTitle) {
    detail.className = '';
    detail.textContent = '';
    if (item.review) detail.appendChild(el('div', { class: 'badge', text: 'summary awaiting physics review' }));
    detail.appendChild(el('h2', { text: item.title }));
    if (laneTitle) detail.appendChild(el('div', { class: 'legend', text: laneTitle }));
    detail.appendChild(el('p', { text: item.summary }));
    const code = el('details', {});
    code.appendChild(el('summary', { text: 'Where in the code' }));
    if (item.files && item.files.length) code.appendChild(fileList(item.files));
    if (item.symbols && item.symbols.length) {
      code.appendChild(el('h3', { text: 'Key symbols' }));
      const p = el('p', {});
      item.symbols.forEach(function (s, i) {
        if (i) p.appendChild(document.createTextNode(' '));
        p.appendChild(el('code', { text: s }));
      });
      code.appendChild(p);
    }
    detail.appendChild(code);
  }

  // ---- module map ----
  const COL_W = 210, NODE_W = 186, NODE_H = 38, GAP = 12, TOP = 44, PAD = 12;

  function renderModuleMap() {
    stage.textContent = '';
    stage.appendChild(el('p', { class: 'legend', text: 'Columns are source folders. Arrows show which part uses which. Dashed orange outline: summary still awaiting physics review.' }));
    const pos = {};
    const lanes = DATA.lanes;
    let maxH = 0;
    lanes.forEach(function (lane, li) {
      lane.nodes.forEach(function (n, ni) {
        pos[n.id] = { x: li * COL_W + PAD + 4, y: TOP + ni * (NODE_H + GAP) };
      });
      maxH = Math.max(maxH, TOP + lane.nodes.length * (NODE_H + GAP));
    });
    const W = lanes.length * COL_W + PAD, H = maxH + PAD;
    const root = svg('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': 'Module map' });

    lanes.forEach(function (lane, li) {
      root.appendChild(svg('rect', { class: 'lane-bg', x: li * COL_W + PAD / 2, y: 0, width: COL_W - 4, height: H, rx: 8 }));
      const t = svg('text', { class: 'lane-title', x: li * COL_W + PAD + 4, y: 26 });
      t.textContent = lane.title.length > 22 ? lane.title.slice(0, 21) + '…' : lane.title;
      const tt = svg('title'); tt.textContent = lane.summary;
      t.appendChild(tt);
      root.appendChild(t);
    });

    const edgeEls = [];
    (DATA.edges || []).forEach(function (e) {
      const a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2;
      let d;
      if (a.x < b.x) { const m = (x1 + x2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + m + ',' + y1 + ' ' + m + ',' + y2 + ' ' + x2 + ',' + y2; }
      else if (a.x > b.x) { const m = (a.x + b.x + NODE_W) / 2; d = 'M' + a.x + ',' + y1 + ' C' + m + ',' + y1 + ' ' + m + ',' + y2 + ' ' + (b.x + NODE_W) + ',' + y2; }
      else { const o = NODE_W + 8; d = 'M' + x1 + ',' + y1 + ' C' + (x1 + o / 2) + ',' + y1 + ' ' + (x1 + o / 2) + ',' + y2 + ' ' + x2 + ',' + y2 + ' '; d = 'M' + (a.x + NODE_W) + ',' + y1 + ' C' + (a.x + NODE_W + 14) + ',' + y1 + ' ' + (a.x + NODE_W + 14) + ',' + y2 + ' ' + (b.x + NODE_W) + ',' + y2; }
      const p = svg('path', { class: 'edge', d: d });
      root.appendChild(p);
      edgeEls.push({ p: p, from: e.from, to: e.to });
    });

    let selected = null;
    function select(g, n, lane) {
      if (selected) selected.classList.remove('sel');
      selected = g; g.classList.add('sel');
      edgeEls.forEach(function (x) { x.p.classList.toggle('hi', x.from === n.id || x.to === n.id); });
      showDetail(n, lane.title);
    }

    lanes.forEach(function (lane) {
      lane.nodes.forEach(function (n) {
        const p = pos[n.id];
        const g = svg('g', { class: 'node' + (n.review ? ' review' : ''), tabindex: 0, role: 'button', transform: 'translate(' + p.x + ',' + p.y + ')', 'aria-label': n.title });
        g.appendChild(svg('rect', { width: NODE_W, height: NODE_H }));
        const t = svg('text', { x: 9, y: NODE_H / 2 + 4.5 });
        t.textContent = n.title.length > 27 ? n.title.slice(0, 26) + '…' : n.title;
        g.appendChild(t);
        g.addEventListener('click', function () { select(g, n, lane); });
        g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(g, n, lane); } });
        root.appendChild(g);
      });
    });
    stage.appendChild(root);
  }

  function renderPlaceholder(name) {
    stage.textContent = '';
    stage.appendChild(el('div', { class: 'placeholder', text: name + ' view: coming in the next step.' }));
  }

  // ---- tabs ----
  const VIEWS = [
    { id: 'map', label: 'Module map', render: renderModuleMap },
    { id: 'flow', label: 'Run flow', render: function () { (window.renderFlow || renderPlaceholder.bind(null, 'Run flow'))(); } },
    { id: 'tasks', label: 'Tasks', render: function () { (window.renderTasks || renderPlaceholder.bind(null, 'Tasks'))(); } }
  ];
  function activate(id) {
    VIEWS.forEach(function (v) {
      v.btn.setAttribute('aria-selected', v.id === id ? 'true' : 'false');
      if (v.id === id) { detail.className = 'empty'; detail.textContent = 'Select a box to see its description.'; v.render(); }
    });
    location.hash = id;
  }
  VIEWS.forEach(function (v) {
    v.btn = el('button', { role: 'tab', type: 'button', text: v.label });
    v.btn.addEventListener('click', function () { activate(v.id); });
    tabsEl.appendChild(v.btn);
  });
  const start = location.hash.slice(1);
  activate(VIEWS.some(function (v) { return v.id === start; }) ? start : 'map');

  window.Explorer = { DATA: DATA, el: el, svg: svg, stage: stage, showDetail: showDetail, fileList: fileList, REPO: REPO };
})();
</script>
</body>
</html>
