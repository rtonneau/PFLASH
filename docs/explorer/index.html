<style>
  :root {
    color-scheme:light;
    --bg:#f5f6f8; --surface:#fff; --sunk:#f0f2f5; --fg:#1a2030; --muted:#525b6c;
    --line:#d6dbe3; --line-strong:#a9b1be;
    --accent:#1d5bc9; --accent-soft:#e7effc; --accent-line:#8fb0ea;
    --out:#12675b; --out-soft:#e8f5f1;
    --in:#6a4bb5; --in-soft:#f1edfa;
    --review:#8f5300; --review-line:#c98a12; --review-soft:#fff5e0;
    --match:#fff3c4; --match-line:#c79a00;
    --mono:ui-monospace, "Cascadia Mono", Consolas, monospace;
    --radius:8px;
  }
  * { box-sizing:border-box; }
  html { scroll-padding-top:calc(var(--header-height, 80px) + 12px); }
  body { margin:0; font:15px/1.5 system-ui, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  button { font:inherit; color:inherit; }
  a { color:var(--accent); }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; border-radius:4px; }
  [hidden] { display:none !important; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .skip { position:fixed; left:16px; top:8px; z-index:10; padding:10px 16px; background:var(--surface); transform:translateY(-150%); }
  .skip:focus { transform:none; }

  /* ---- header and tabs ---- */
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:12px 28px; padding:16px 24px;
           background:var(--surface); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; letter-spacing:-.01em; }
  header p { margin:0; color:var(--muted); font-size:13.5px; }
  [role=tablist] { display:flex; gap:2px; padding:3px; background:var(--sunk); border-radius:9px; margin-left:auto; }
  [role=tab] { border:0; background:transparent; min-height:40px; padding:8px 16px; border-radius:7px; cursor:pointer; color:var(--muted); font-weight:500; }
  [role=tab]:hover { color:var(--fg); }
  [role=tab][aria-selected=true] { background:var(--surface); color:var(--accent); font-weight:600; box-shadow:0 1px 2px rgba(20,30,50,.12); }

  /* ---- layout ---- */
  main { display:grid; grid-template-columns:minmax(0,1fr) 370px; align-items:start; }
  #stage { padding:24px 24px 40px; min-width:0; }
  #detail { position:sticky; top:var(--header-height, 80px); max-height:calc(100vh - var(--header-height, 80px)); overflow:auto; background:var(--surface);
            border-left:1px solid var(--line); padding:20px 24px 32px; min-height:calc(100vh - var(--header-height, 80px)); }
  .view-heading { margin:0 0 4px; font-size:24px; line-height:1.25; letter-spacing:-.025em; }
  .intro { margin:0 0 16px; color:var(--muted); font-size:14px; max-width:80ch; }
  .starts-heading { margin:0 0 8px; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.04em; text-transform:uppercase; }

  /* ---- shared bits ---- */
  .flag { display:inline-flex; align-items:center; gap:4px; color:var(--review); font-size:12px; font-weight:600; white-space:nowrap; }
  .badge { display:inline-block; background:var(--review-soft); color:var(--review); border:1px solid var(--review-line);
           border-radius:999px; padding:1px 9px; font-size:12px; font-weight:600; }
  .tag { display:inline-block; background:var(--sunk); color:var(--muted); border-radius:999px; padding:1px 9px; font-size:12px; font-weight:600; }
  .chip-out { display:inline-block; font:12px var(--mono); background:#edf6ef; color:#1d5130; border:1px solid #b7d9c0; border-radius:6px; padding:1px 7px; }
  code { font:12.5px var(--mono); background:var(--sunk); padding:1px 5px; border-radius:4px; }

  /* ---- module map ---- */
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; margin:0 0 12px; }
  .search-label { font-size:13px; font-weight:600; }
  .search { position:relative; flex:1 1 280px; }
  .search input { width:100%; min-height:44px; padding:9px 44px 9px 12px; border:1px solid var(--line-strong); border-radius:7px; font:inherit; font-size:14px; background:var(--surface); }
  .search input:focus-visible { outline-offset:0; }
  .search .clear { position:absolute; right:2px; top:50%; transform:translateY(-50%); width:40px; height:40px; border:0; background:none; cursor:pointer; color:var(--muted); font-size:20px; }
  .count { font-size:13px; color:var(--muted); min-width:9ch; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--muted); margin:0 0 20px; align-items:center; }
  .legend svg { vertical-align:middle; margin-right:4px; }
  .map-scope { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; margin:0 0 8px; }
  .map-scope button { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:8px 12px; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); cursor:pointer; font-size:13px; font-weight:600; }
  .map-scope button[aria-pressed=true] { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .map-scope button:disabled { cursor:default; color:var(--muted); border-color:var(--line); }
  .map-scope p { margin:0; color:var(--muted); font-size:13px; overflow-wrap:anywhere; }
  #stage.connections-mode > .starts-heading, #stage.connections-mode > .entry-points { display:none; }
  .map-wrap { position:relative; padding:40px 40px 0; }
  .lanes { columns:250px; column-gap:56px; }
  .lane { break-inside:avoid; margin:0 0 20px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .lane-title { margin:0; }
  .lane-head { display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:0; background:none; min-height:32px; padding:0 2px; cursor:pointer; border-radius:6px; }
  .lane-head b { flex:1; font-size:15px; font-weight:650; color:var(--fg); }
  .lane-head .lane-count { flex:none; display:grid; place-items:center; min-width:24px; height:24px; border-radius:6px; background:var(--sunk); color:var(--muted); font-size:12px; font-weight:500; }
  .lane-summary { margin:2px 2px 12px; font-size:13px; color:var(--muted); line-height:1.45; }
  .lane-head:hover b { color:var(--accent); }
  .lane.sel { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .node { position:relative; z-index:2; display:flex; align-items:center; gap:8px; width:100%; min-height:58px; margin-top:8px; padding:9px 12px;
          text-align:left; background:#fbfcfd; border:1px solid var(--line); border-radius:7px; cursor:pointer;
          font-size:13.5px; line-height:1.3; transition:opacity .12s, border-color .12s; }
  .node .t { flex:1; min-width:0; }
  .node .nm { display:block; font-weight:600; overflow-wrap:anywhere; }
  .node .role { display:block; margin-top:3px; font-size:13px; line-height:1.4; color:var(--muted); }
  .node:hover { border-color:var(--accent-line); background:var(--surface); }
  .node:not(.sel):hover { border-color:var(--accent); }
  .node.review { border-style:dashed; border-color:var(--review-line); }
  /* relationship tags sit on the box's top edge, so long class names never reflow */
  .rel { display:none; font-size:11px; font-weight:600; line-height:16px; padding:0 6px; border-radius:999px;
         white-space:nowrap; border:1px solid; background:var(--surface); }
  .node .rel { position:absolute; top:-8px; right:10px; }
  .rel.r-out { color:var(--out); border-color:var(--out); }
  .rel.r-in { color:var(--in); border-color:var(--in); border-style:dashed; }
  .node.out .rel.r-out, .node.in .rel.r-in, .legend .rel { display:inline-block; }
  .node.out { border-color:var(--out); }
  .node.in { border-color:var(--in); border-style:dashed; }
  .node.out, .node.in { margin-top:16px; }
  .node.sel { background:var(--accent); border:1px solid var(--accent); color:#fff; }
  .node.sel .flag { color:#fff; }
  .node.sel .role { color:#e6eefc; }
  .other { display:block; width:100%; margin-top:6px; padding:4px 9px; text-align:left; border:1px dashed var(--line-strong);
           background:none; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--muted); }
  .other:hover { color:var(--accent); border-color:var(--accent-line); }
  .has-sel .node:not(.sel):not(.in):not(.out) { background:var(--sunk); }
  .searching .node:not(.match), .searching .other:not(.match), .searching .lane.nomatch { display:none; }
  .no-results { padding:24px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); color:var(--muted); }
  .node.match, .other.match { background:var(--match); border-color:var(--match-line); opacity:1; }
  .node.sel.match { background:var(--accent); }
  .edges { position:absolute; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; overflow:visible; }
  .edges path { fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .edges path.halo { stroke:#fff; stroke-width:6; stroke-opacity:.9; }
  .edges .e-out { stroke:var(--out); }
  .edges .e-in { stroke:var(--in); stroke-dasharray:6 4; }

  /* The focused map puts every direct connection beside the selected part.
     Only the empty gaps between columns contain arrows. */
  .connection-map { position:relative; padding:18px 4px 8px; }
  .connection-columns { display:grid; grid-template-columns:minmax(0,1fr) minmax(180px,.86fr) minmax(0,1fr); gap:64px; align-items:center; }
  .connection-columns.one-sided { grid-template-columns:minmax(180px,.86fr) minmax(0,1fr); max-width:760px; margin:auto; }
  .connection-columns.isolated { display:block; max-width:360px; margin:auto; }
  .connection-group, .connection-hub { min-width:0; }
  .connection-heading { display:flex; align-items:center; gap:6px; margin:0 0 12px; font-size:12px; line-height:1.4; color:var(--muted); }
  .connection-heading .tag { margin-left:auto; }
  .connection-heading svg, .connection-heading .tag { flex:none; }
  .connection-label { min-width:0; overflow-wrap:anywhere; }
  .connection-group.incoming .connection-heading { color:var(--in); }
  .connection-group.outgoing .connection-heading { color:var(--out); }
  .connection-map .node { margin:0; min-height:74px; padding:8px 12px; background:var(--surface); }
  .connection-map .node + .node { margin-top:10px; }
  .connection-map .node.out { border-left:3px solid var(--out); }
  .connection-map .node.in { border-left:3px dashed var(--in); }
  .connection-map .node.sel { background:var(--accent); }
  .connection-map .node.out:hover, .connection-map .node.out:focus-visible { background:var(--out-soft); border-color:var(--out); }
  .connection-map .node.in:hover, .connection-map .node.in:focus-visible { background:var(--in-soft); border-color:var(--in); }
  .connection-folder { display:flex; align-items:center; gap:5px; margin-bottom:4px; font-size:11px; line-height:1.3; color:var(--muted); }
  .connection-folder svg { flex:none; width:13px; height:13px; }
  .node.sel .connection-folder { color:#e6eefc; }
  .connection-map .edges path { stroke-width:2; }
  .connection-map .edges path.halo { stroke:var(--bg); stroke-width:7; }
  .connection-map.tracing .edges .e:not(.traced) { opacity:.16; }
  .connection-map .edges .e.traced { stroke-width:3; }
  .connection-empty { color:var(--muted); font-size:13px; }
  .connection-tip { margin:14px 0 0; font-size:12.5px; color:var(--muted); }
  .connection-details { display:none; margin-top:12px; width:100%; }
  @media (min-width:901px) and (max-width:1250px) {
    main:has(.connections-mode) { grid-template-columns:minmax(0,1fr); }
    main:has(.connections-mode) #detail { position:static; max-height:none; min-height:0; border-left:0; border-top:1px solid var(--line); }
    .connection-details { display:block; }
    main:has(.connections-mode) #detail .back { display:inline-block; }
  }

  /* ---- run flow ---- */
  .flow { max-width:1040px; }
  .phase { margin:0 0 20px; padding:14px 16px 4px; border:1px solid var(--line); border-radius:10px; }
  .phase-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 8px; }
  .phase-head h3 { margin:0; font-size:16px; }
  .phase-head p { margin:0; color:var(--muted); font-size:13.5px; }
  .phase.loop { background:#eef2f8; border-color:#d3dbe8; }
  .phase.loop .phase-head h3::before { content:"\21BB"; margin-right:6px; color:var(--accent); font-weight:400; }
  ol.steps { list-style:none; margin:0; padding:0; }
  ol.steps > li { position:relative; padding:0 0 10px 46px; }
  ol.steps > li::before { content:""; position:absolute; left:15px; top:30px; bottom:-2px; width:2px; background:var(--muted); }
  ol.steps > li:not(:last-child)::after { content:""; position:absolute; left:12px; bottom:2px;
    width:8px; height:8px; border-right:2px solid var(--muted); border-bottom:2px solid var(--muted); transform:rotate(45deg); }
  ol.steps > li:last-child::before { display:none; }
  .num { position:absolute; left:0; top:8px; width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
         background:var(--surface); border:2px solid var(--line-strong); font-weight:700; font-size:14px; color:var(--muted); }
  .card { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; cursor:pointer; }
  .card:hover { border-color:var(--accent-line); }
  .card:not([aria-current=true]):hover { border-color:var(--accent); }
  .card[aria-current=true] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); background:#fbfdff; }
  li:has(> .card[aria-current=true]) > .num { border-color:var(--accent); background:var(--accent); color:#fff; }
  .card.review { border-style:dashed; border-color:var(--review-line); }
  .card-title { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-weight:600; }
  .card-sum { color:var(--muted); font-size:14px; margin-top:2px; }
  .fork { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:8px; margin:6px 0 0; padding:0; list-style:none; }
  .fork li { border:1px solid var(--line); border-left:3px solid var(--line-strong); border-radius:6px; padding:6px 10px; font-size:13.5px; background:#fafbfc; }
  .fork li.current { border-color:var(--accent); border-left-color:var(--accent); background:var(--accent-soft); }
  .fork li.skipped > span { font-style:italic; }
  .fork b { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; }
  .fork b small { font-weight:400; color:var(--muted); }
  .fork .shown { margin-left:auto; font-size:11.5px; color:var(--accent); }
  .fork li > span { display:block; color:var(--muted); }
  /* chemistry-mode chooser under step 2 of the run flow */
  .mode-pick { margin:8px 0 0; padding:4px 12px 10px; border:1px solid var(--accent-line); border-radius:var(--radius); background:var(--surface); min-width:0; }
  .mode-pick legend { padding:0 4px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .mode-pick .opts { display:flex; flex-wrap:wrap; gap:6px; }
  .mode-pick label { display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:5px 12px 5px 9px; border:1px solid var(--line-strong);
                     border-radius:999px; cursor:pointer; font-size:13.5px; background:var(--surface); }
  .mode-pick label:hover { border-color:var(--accent); }
  .mode-pick input { margin:0; accent-color:var(--accent); }
  .mode-pick input:focus-visible { outline:none; }
  .mode-pick label:has(input:focus-visible) { outline:3px solid var(--accent); outline-offset:2px; }
  .mode-pick label:has(input:checked) { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .mode-pick small { font-weight:400; color:var(--muted); }
  .card-mode { display:block; margin-top:6px; padding:3px 9px; font-size:13px; line-height:1.4; border-left:3px solid var(--accent);
               background:var(--accent-soft); border-radius:0 5px 5px 0; }
  .card-mode b { color:var(--accent); font-weight:600; }
  .card[aria-current=true] .card-mode { background:var(--surface); }
  ol.steps > li.skipped .card { background:var(--sunk); border-style:dashed; border-color:var(--line-strong); }
  ol.steps > li.skipped .card-title { color:var(--muted); }
  ol.steps > li.skipped .card .tag { background:var(--surface); border:1px dashed var(--line-strong); }
  ol.steps > li.skipped > .num { border-style:dashed; background:var(--sunk); }
  .writes { display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-top:8px; font-size:12.5px; color:var(--muted); }

  /* ---- tasks ---- */
  .tasks-group h3 { font-size:16px; margin:24px 0 12px; }
  .tasks { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:14px; max-width:1100px; margin-bottom:24px; }
  .tasks .card { height:100%; display:flex; flex-direction:column; align-items:stretch; }
  .tasks .meta { margin-top:auto; padding-top:12px; }
  .meta { margin-top:6px; font-size:12.5px; color:var(--muted); }

  /* ---- detail panel ---- */
  .kicker { font-size:12.5px; color:var(--muted); margin:0 0 4px; display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }
  .kicker button { border:0; background:none; padding:0; color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
  #detail h2 { margin:0 0 8px; font-size:19px; line-height:1.25; overflow-wrap:anywhere; }
  #detail .lead { margin:8px 0 0; }
  #detail h3 { margin:18px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .links { display:flex; flex-wrap:wrap; gap:6px; }
  .link { border:1px solid var(--line); background:var(--surface); border-radius:6px; min-height:40px; padding:7px 10px; cursor:pointer; font-size:13.5px; text-align:left; overflow-wrap:anywhere; }
  .link:hover { border-color:var(--accent); color:var(--accent); }
  .link.l-out { border-left:3px solid var(--out); }
  .link.l-in { border-left:3px dashed var(--in); }
  .link.l-out:hover, .link.l-out:focus-visible { border-color:var(--out); color:var(--out); background:var(--out-soft); }

  };

  // ---- configuration ----
  function defaults() {
    return {
      title: '',
      filename: 'my_macro.in',
      logLevel: 'Quiet',
      runVerbose: '0',
      trackingVerbose: '0',
      solvation: 'default',
      chemistry: 'PureWater',
      model: 'IRT_syn',
      meso: true,
      endTimeMode: 'default',
      endTime: { value: '1', unit: 'ms' },
      handOver: { value: '5', unit: 'ns' },
      voxel: { value: '6.25', unit: 'nm' },
      timesPerDecade: '10',
      spatialOutput: false,
      binsMode: 'default',
      binWidth: { value: '1', unit: 'ns' },
      binList: { values: '1 10 100 1000', unit: 'ps' },
      o2: false,
      o2Value: { value: '21', unit: '%' },
      pH: '7',
      halfBox: { value: '500', unit: 'um' },
      outputDirMode: 'default',
      outputDir: '',
      particle: 'e-',
      energy: { value: '10', unit: 'keV' },
      killerMode: 'default',
      eLossMin: { value: '500', unit: 'keV' },
      eLossMax: { value: '1', unit: 'MeV' },
      runs: [{ events: '2', seeds: '', dump: 'reset', name: '' }]
    };
  }
  const MESO_DEFAULTS = { handOver: { value: '5', unit: 'ns' }, voxel: { value: '6.25', unit: 'nm' }, timesPerDecade: '10', spatialOutput: false };

  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function get(cfg, path) {
    return String(path).split('.').reduce(function (o, k) { return o === undefined || o === null ? undefined : o[k]; }, cfg);
  }
  // Returns a new configuration; only the listed paths change.
  function applyPatch(cfg, patch) {
    const out = clone(cfg);
    Object.keys(patch).forEach(function (path) {
      const keys = path.split('.');
      let o = out;
      for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
      o[keys[keys.length - 1]] = clone(patch[path]);
    });
    return out;
  }
  // Fills fields missing from an older saved configuration with defaults.
  function normalize(cfg) {
    const d = defaults();
    const out = Object.assign(d, cfg || {});
    if (!Array.isArray(out.runs) || !out.runs.length) out.runs = defaults().runs;
    return out;
  }

  // ---- parsing helpers ----
  const NUMBER_RE = /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/;
  function num(text) {
    const s = String(text === undefined || text === null ? '' : text).trim();
    if (!s) return { empty: true };
    if (!NUMBER_RE.test(s)) return { bad: true };
    const v = Number(s);
    return isFinite(v) ? { value: v } : { bad: true };
  }
  function fmt(v) { return String(Number(v)); }
  function inBase(q, category) { const n = num(q.value); return n.value === undefined ? null : n.value * UNITS[category][q.unit]; }
  function sameQ(a, b) { const x = num(a.value), y = num(b.value); return a.unit === b.unit && x.value !== undefined && x.value === y.value; }

  function mesoOn(cfg) { return cfg.model !== 'SBS' && !!cfg.meso; }
  function mesoCustomized(cfg) {
    return !sameQ(cfg.handOver, MESO_DEFAULTS.handOver) || !sameQ(cfg.voxel, MESO_DEFAULTS.voxel) ||
      String(cfg.timesPerDecade).trim() !== MESO_DEFAULTS.timesPerDecade || !!cfg.spatialOutput;
  }
  function phCustomized(cfg) { const n = num(cfg.pH); return !(n.value === 7); }
  function killerApplies(cfg) { return cfg.particle === 'e-'; }
  // Effective chemistry end time in seconds (null when the custom value is invalid).
  function endTimeSeconds(cfg) {
    if (cfg.endTimeMode === 'custom') return inBase(cfg.endTime, 'time');
    return mesoOn(cfg) ? 1 : 1e-6;
  }
  function describeSeconds(s) {
    if (s === null) return 'invalid';
    const units = [['s', 1], ['ms', 1e-3], ['us', 1e-6], ['ns', 1e-9], ['ps', 1e-12]];
    for (const u of units) if (s >= u[1]) return fmt(+(s / u[1]).toPrecision(6)) + ' ' + u[0];
    return fmt(s / 1e-12) + ' ps';
  }

  // ---- availability rules (option or field level) ----
  // null = available; otherwise { kind: 'incompatible' | 'unsupported', why, fix? }.
  const RULES = {
    modeIRT: function () {
      return { kind: 'unsupported', why: 'Classic IRT is accepted by Geant4 but dnachem-min stops at /run/initialize (UnsupportedTimeStepModel): only IRT_syn and SBS are supported.' };
    },
    modeSBS: function (cfg) {
      if (cfg.model !== 'SBS' && cfg.meso) {
        return { kind: 'incompatible', why: 'The mesoscopic stage is on, and SBS has no mesoscopic stage (the combination is fatal at /run/initialize: MesoWithSbs).',
          fix: { label: 'Turn the mesoscopic stage off', patch: { meso: false } } };
      }
      return null;
    },
    mesoTrue: function (cfg) {
      if (cfg.model === 'SBS') {
        return { kind: 'incompatible', why: 'The SBS time-step model has no mesoscopic stage (fatal at /run/initialize: MesoWithSbs).',
          fix: { label: 'Switch the time-step model to IRT_syn', patch: { model: 'IRT_syn' } } };
      }
      return null;
    },
    mesoParams: function (cfg) {
      if (mesoOn(cfg)) return null;
      return { kind: 'incompatible', why: 'These settings only apply to the mesoscopic stage, which is off.',
        fix: { label: cfg.model === 'SBS' ? 'Use IRT_syn with the mesoscopic stage' : 'Turn the mesoscopic stage on',
          patch: cfg.model === 'SBS' ? { model: 'IRT_syn', meso: true } : { meso: true } } };
    },
    pH: function (cfg) {
      const c = chemistryInfo(cfg.chemistry);
      if (c && !c.buffer) {
        return { kind: 'incompatible', why: cfg.chemistry + ' has no acid-base buffer, so /chem/env/pH has no chemical effect.',
          fix: { label: 'Switch the Chemistry to PureWater', patch: { chemistry: 'PureWater' } } };
      }
      return null;
    },
    killer: function (cfg) {
      if (killerApplies(cfg)) return null;
      return { kind: 'incompatible', why: 'The primary-killer energy cuts act only on a primary electron (track 1, e-); with ' + cfg.particle + ' they do nothing.',
        fix: { label: 'Switch the particle to e-', patch: { particle: 'e-' } } };
    }
  };

  // ---- fields (the guide renders these; validation and generation read the same config) ----
  function q(id, opts) { return Object.assign({ id: id, path: id }, opts); }
  const FIELDS = [
    q('title', { step: 'basics', type: 'text', label: 'Description', required: false,
      help: 'One line describing what this macro is for. It is written as the first comment of the file.',
      tech: 'Written as a "#" comment line; the macro reader ignores it.', placeholder: 'e.g. 10 keV electrons in air-saturated water' }),
    q('logLevel', { step: 'basics', type: 'choice', label: 'Project log level', required: false,
      options: ['Quiet', 'Error', 'Warning', 'Info', 'Debug', 'Trace'].map(function (v) {
        return { value: v, label: v + (v === 'Quiet' ? ' (default)' : '') };
      }),
      help: 'How much dnachem-min itself reports. Info gives one line per chemistry stage and dump; Debug and Trace are for diagnosing problems.',
      tech: '/dnaLogger/verbose <level>, any application state. Default Quiet (written only when changed).', refs: SRC.logger }),
    q('runVerbose', { step: 'basics', type: 'number', label: 'Geant4 run verbosity', required: false, integer: true,
      help: 'Geant4 run-manager messages. 0 is silent.', tech: '/run/verbose 0..4, default 0 (written only when changed).', refs: SRC.runVerbose }),
    q('trackingVerbose', { step: 'basics', type: 'number', label: 'Geant4 tracking verbosity', required: false, integer: true,
      help: 'Prints every step of every track. Leave at 0 except for debugging a single event: output is huge.',
      tech: '/tracking/verbose >= -1, default 0 (written only when changed).', refs: SRC.trackingVerbose }),

    q('chemistry', { step: 'chemistry', type: 'choice', label: 'Chemistry (reaction network)', required: true,
      options: CHEMISTRIES.map(function (c) { return { value: c.value, label: c.label + (c.value === 'PureWater' ? ' (default)' : ''), help: c.note }; }),
      help: 'The set of chemical reactions. Molecules and water dissociation are shared; the reactions and their rates come from the selected Chemistry.',
      tech: '/chem/select <name>, PreInit (before /run/initialize). Only one Chemistry per process.', refs: SRC.chemistry }),
    q('model', { step: 'chemistry', type: 'choice', label: 'Chemistry time-step model', required: true,
      options: [
        { value: 'IRT_syn', label: 'IRT_syn (default)', help: 'Independent reaction times, synchronised. Fast; can hand over to the mesoscopic stage.' },
        { value: 'SBS', label: 'SBS', help: 'Step-by-step diffusion of every molecule. Slower; every reaction fully diffusion-controlled; no mesoscopic stage.', rule: 'modeSBS' },
        { value: 'IRT', label: 'IRT (classic)', help: 'Geant4 offers it, dnachem-min does not.', rule: 'modeIRT' }
      ],
      help: 'How the simulation advances chemistry in time.',
      tech: '/process/chem/TimeStepModel IRT_syn|SBS, PreInit. Always written so the mode is explicit.', refs: SRC.model }),
    q('meso', { step: 'chemistry', type: 'bool', label: 'Mesoscopic stage', required: true,
      options: [
        { value: true, label: 'On (default with IRT_syn)', help: 'At the hand-over time the remaining molecules move to counts on a cell mesh, which is much faster for long times (up to 1 s by default).', rule: 'mesoTrue' },
        { value: false, label: 'Off', help: 'The particle-based stage runs to the end time (1 us by default). No SpeciesMeso output.' }
      ],
      help: 'Whether the particle-based chemistry hands over to a faster mesh-based model at the hand-over time.',
      tech: '/chem/meso/enable true|false, PreInit. SBS with an explicit true is fatal (MesoWithSbs).', refs: SRC.meso }),
    q('solvation', { step: 'chemistry', type: 'choice', label: 'Electron solvation model', required: false,
      options: [
        { value: 'default', label: 'Not set (Geant4 uses Meesungnoen2002)', help: 'No command is written.' },
        { value: 'Ritchie1994', label: 'Ritchie1994', help: 'Used by most project macros.' },
        { value: 'Meesungnoen2002', label: 'Meesungnoen2002', help: 'Same model as "not set", written explicitly.' },
        { value: 'Terrisol1990', label: 'Terrisol1990' }
      ],
      help: 'How far a slowed-down electron travels before it becomes a solvated electron (e_aq). It shifts the initial e_aq distribution.',
      tech: '/process/dna/e-SolvationSubType, PreInit. Geant4 also accepts Kreipl2009 and Meesungnoen2002_amorphous; they are not offered because no dnachem-min macro or test exercises them.', refs: SRC.solvation }),

    q('endTimeMode', { step: 'timing', type: 'choice', label: 'Chemistry end time', required: true,
      options: [
        { value: 'default', label: 'Default', help: '1 s with the mesoscopic stage, 1 us without. A full 1 s run is slow.' },
        { value: 'custom', label: 'Custom', help: 'For example 1 ms for a quick smoke test.' }
      ],
      help: 'When the chemistry of each event stops.',
      tech: '/scheduler/endTime <value> <unit>, written after /run/initialize: initialization resets the end time to the mode default.', refs: SRC.endTime }),
    q('endTime', { step: 'timing', type: 'quantity', category: 'time', label: 'End time', required: true, showIf: function (c) { return c.endTimeMode === 'custom'; },
      help: 'Must be greater than 0.', refs: SRC.endTime }),
    q('handOver', { step: 'timing', type: 'quantity', category: 'time', label: 'Hand-over time', required: false, rule: 'mesoParams', group: 'meso',
      help: 'When the particle-based stage hands over to the mesoscopic stage. Default 5 ns.',
      tech: '/chem/meso/handOverTime <value> <unit>, PreInit, > 0. Written only when changed.', refs: SRC.meso }),
    q('voxel', { step: 'timing', type: 'quantity', category: 'length', label: 'Requested mesh cell size', required: false, rule: 'mesoParams', group: 'meso',
      help: 'Target side of one mesh cell. The mesh uses the power-of-2 cell count closest to it, at most 65536 cells per side. Default 6.25 nm.',
      tech: '/chem/meso/voxelSize <value> <unit>, PreInit, > 0. Written only when changed.', refs: SRC.meso }),
    q('timesPerDecade', { step: 'timing', type: 'number', integer: true, label: 'Record times per decade', required: false, rule: 'mesoParams', group: 'meso',
      help: 'How many output times per factor of 10 in time, from the hand-over time to the end time. Default 10.',
      tech: '/chem/meso/timesPerDecade <n>, PreInit, >= 1. Written only when changed.', refs: SRC.meso }),
    q('spatialOutput', { step: 'timing', type: 'bool', label: 'Spatial snapshots (HDF5)', required: false, rule: 'mesoParams', group: 'meso',
      options: [{ value: false, label: 'Off (default)' }, { value: true, label: 'On: write SpeciesMesoSpatial.h5' }],
      help: 'Saves where the species are on the mesh at every record time. The file can be very large.',
      tech: '/chem/meso/spatialOutput true, PreInit. Written only when on.', refs: SRC.meso }),
    q('binsMode', { step: 'timing', type: 'choice', label: 'Reaction-count time bins', required: false,
      options: [
        { value: 'default', label: 'Built-in table (default)', help: 'A fixed 7-edge table.' },
        { value: 'fixed', label: 'Fixed width' },
        { value: 'list', label: 'Explicit edges' }
      ],
      help: 'How reaction counts are grouped in time in Reactions.Txt (particle-based stage only). The two custom forms cannot be combined.',
      tech: '/chem/reaction/timeBinsFixed or /chem/reaction/timeBinsList, PreInit; issuing both is fatal (ConflictingTimeBins).', refs: SRC.bins }),
    q('binWidth', { step: 'timing', type: 'quantity', category: 'time', label: 'Bin width', required: true, showIf: function (c) { return c.binsMode === 'fixed'; },
      help: 'Bins of this width up to the end time.', refs: SRC.bins }),
    q('binList', { step: 'timing', type: 'list', category: 'time', label: 'Bin edges', required: true, showIf: function (c) { return c.binsMode === 'list'; },
      help: 'Upper bin edges separated by spaces, all in one unit.', refs: SRC.bins }),

    q('halfBox', { step: 'environment', type: 'quantity', category: 'length', label: 'Water box half side', required: false,
      help: 'The water box is the whole geometry: it bounds the tracks, chemistry diffusion and the number of dissolved scavenger molecules. Default 500 um (a 1 mm cube).',
      tech: '/chem/env/halfBox <value> <unit>, PreInit, > 0. Written only when changed.', refs: SRC.halfBox }),
    q('o2', { step: 'environment', type: 'bool', label: 'Dissolved oxygen (O2)', required: false,
      options: [{ value: false, label: 'None (default, anoxic)' }, { value: true, label: 'Add dissolved O2' }],
      help: 'O2 reacts with e_aq, H and O- through the selected Chemistry\'s bulk reactions. Every Chemistry here has them.',
      tech: '/chem/env/scavenger O2 <value> <unit>, PreInit. Other scavenger species are not offered: no Chemistry here has bulk reactions for them, so they would be inert.', refs: SRC.o2 }),
    q('o2Value', { step: 'environment', type: 'quantity', category: 'o2', label: 'O2 concentration', required: true, showIf: function (c) { return c.o2; },
      help: '% means percent of a pure-O2 atmosphere (Henry\'s law, kH = 0.0013 M): 21 % is air-saturated water (2.73e-4 M). 0 means absent.', refs: SRC.o2 }),
    q('pH', { step: 'environment', type: 'number', label: 'pH', required: false, rule: 'pH',
      help: 'Sets the bulk H3O+ / OH- buffer concentrations used by the acid-base reactions. Default 7.',
      tech: '/chem/env/pH <value>, PreInit. The code does not range-check it. Written only when changed.', refs: SRC.pH }),

    q('particle', { step: 'beam', type: 'choice', label: 'Particle', required: true,
      options: [
        { value: 'e-', label: 'Electron, e- (default)', help: 'The project\'s main use case.' },
        { value: 'proton', label: 'Proton', help: 'Used by the Farokhi2023 comparison macros.' }
      ],
      help: 'The primary particle. It starts at the box centre (0, 0, 0) moving along +z; position and direction are fixed in the code.',
      tech: '/gun/particle, after /run/initialize. Defaults in PrimaryGeneratorAction: e-, 2 MeV, (0,0,0), +z.', refs: SRC.gun }),
    q('energy', { step: 'beam', type: 'quantity', category: 'energy', label: 'Kinetic energy', required: true,
      help: 'Must be greater than 0. Project tests use 10 keV electrons.', tech: '/gun/energy <value> <unit>.', refs: SRC.gun }),
    q('killerMode', { step: 'beam', type: 'choice', label: 'Primary-electron energy cuts', required: false, rule: 'killer',
      options: [
        { value: 'default', label: 'Code defaults (500 keV / 1 MeV)', help: 'Already active in every run, no command written.' },
        { value: 'custom', label: 'Custom' }
      ],
      help: 'The primary electron is stopped once it has lost "stop after" energy, and the whole event is discarded once it has lost "abort after".',
      tech: '/primaryKiller/eLossMin and /primaryKiller/eLossMax; these commands exist only after /run/initialize. /primaryKiller/minKineticE is not offered: it has no effect (no handler).', refs: SRC.killer }),
    q('eLossMin', { step: 'beam', type: 'quantity', category: 'energy', label: 'Stop the primary after losing', required: true, rule: 'killer', showIf: function (c) { return c.killerMode === 'custom'; }, refs: SRC.killer }),
    q('eLossMax', { step: 'beam', type: 'quantity', category: 'energy', label: 'Abort the event after losing', required: true, rule: 'killer', showIf: function (c) { return c.killerMode === 'custom'; }, refs: SRC.killer }),

    q('runs', { step: 'runs', type: 'runs', label: 'Sub-runs', required: true,
      help: 'Each sub-run simulates some events. Results accumulate across sub-runs until a dump writes and resets them.',
      tech: '/random/setSeeds, /run/beamOn <events>, then /run/dumpDataAndReset [prefix] or /run/dumpDataAndResetToDir <subfolder>.', refs: SRC.runs }),
    q('outputDirMode', { step: 'runs', type: 'choice', label: 'Output folder', required: false,
      options: [
        { value: 'default', label: 'Default (<build>/results, or --dir)', help: 'Recommended: choose the folder at launch with --dir.' },
        { value: 'custom', label: 'Fixed in the macro' }
      ],
      help: 'Where all output files go.',
      tech: '/run/outputDir <path>, PreInit. Launching with a different --dir is then fatal (ConflictingOutputDir).', refs: SRC.outputDir }),
    q('outputDir', { step: 'runs', type: 'text', label: 'Output folder path', required: true, showIf: function (c) { return c.outputDirMode === 'custom'; },
      help: 'Its parent folder must already exist. No spaces or "#".', placeholder: 'results_o2' })
  ];
  const FIELD = {};
  FIELDS.forEach(function (f) { FIELD[f.id] = f; });

  function fieldAvailability(cfg, f) { return f.rule ? RULES[f.rule](cfg) : null; }
  function optionAvailability(cfg, o) { return o.rule ? RULES[o.rule](cfg) : null; }
  function visible(cfg, f) { return !f.showIf || f.showIf(cfg); }

  // ---- validation ----
  const BLOCKING = { incomplete: true, invalid: true, incompatible: true, unsupported: true };
  function validate(cfg) {
    const issues = [];
    function add(field, kind, message, resolutions, severity) {
      const step = (FIELD[String(field).split('.')[0]] || {}).step || 'review';
      issues.push({ field: field, step: step, kind: kind, severity: severity || (BLOCKING[kind] ? 'error' : kind),
        message: message, resolutions: resolutions || [] });
    }
    function positive(field, qty, what) {
      const n = num(qty.value);
      if (n.empty) add(field, 'incomplete', what + ' is required.');
      else if (n.bad) add(field, 'invalid', what + ': "' + qty.value + '" is not a number.');
      else if (!(n.value > 0)) add(field, 'invalid', what + ' must be greater than 0.');
      return n.value > 0;
    }
    function integer(field, text, min, what, maxv) {
      const s = String(text).trim();
      if (!s) { add(field, 'incomplete', what + ' is required.'); return false; }
      if (!/^[+-]?\d+$/.test(s)) { add(field, 'invalid', what + ' must be a whole number.'); return false; }
      const v = Number(s);
      if (v < min || (maxv !== undefined && v > maxv)) {
        add(field, 'invalid', what + ' must be ' + (maxv !== undefined ? 'between ' + min + ' and ' + maxv : 'at least ' + min) + '.');
        return false;
      }
      return true;
    }
    function unitOk(field, qty, units) {
      if (units.indexOf(qty.unit) < 0) { add(field, 'invalid', 'Unit "' + qty.unit + '" is not supported here (use ' + units.join(', ') + ').'); return false; }
      return true;
    }
    function safeText(field, text, what) {
      if (/[\s#"]/.test(text)) { add(field, 'invalid', what + ' must not contain spaces, quotes or "#" (Geant4 splits macro parameters at spaces and treats "#" as a comment).'); return false; }
      return true;
    }

    // Basics
    integer('runVerbose', cfg.runVerbose, 0, 'Run verbosity', 4);
    integer('trackingVerbose', cfg.trackingVerbose, -1, 'Tracking verbosity');
    if (/[\r\n]/.test(cfg.title)) add('title', 'invalid', 'The description must be a single line.');

    // Chemistry
    if (!chemistryInfo(cfg.chemistry)) add('chemistry', 'invalid', 'Unknown Chemistry "' + cfg.chemistry + '".');
    if (cfg.model === 'IRT') add('model', 'unsupported', RULES.modeIRT().why, [{ label: 'Use IRT_syn', patch: { model: 'IRT_syn' } }, { label: 'Use SBS', patch: { model: 'SBS', meso: false } }]);
    else if (cfg.model !== 'IRT_syn' && cfg.model !== 'SBS') add('model', 'invalid', 'Unknown time-step model "' + cfg.model + '".');
    if (cfg.model === 'SBS' && cfg.meso) {
      add('meso', 'incompatible', 'SBS has no mesoscopic stage, but the mesoscopic stage is on: /run/initialize would stop with MesoWithSbs.',
        [{ label: 'Turn the mesoscopic stage off', patch: { meso: false } }, { label: 'Switch back to IRT_syn', patch: { model: 'IRT_syn' } }]);
    }

    // Timing
    if (cfg.endTimeMode === 'custom') {
      unitOk('endTime', cfg.endTime, Object.keys(UNITS.time));
      positive('endTime', cfg.endTime, 'End time');
    }
    const endS = endTimeSeconds(cfg);
    if (mesoOn(cfg)) {
      unitOk('handOver', cfg.handOver, Object.keys(UNITS.time));
      unitOk('voxel', cfg.voxel, Object.keys(UNITS.length));
      const hoOk = positive('handOver', cfg.handOver, 'Hand-over time');
      positive('voxel', cfg.voxel, 'Mesh cell size');
      integer('timesPerDecade', cfg.timesPerDecade, 1, 'Record times per decade');
      const ho = inBase(cfg.handOver, 'time');
      if (hoOk && endS !== null && ho >= endS) {
        add('handOver', 'warning', 'The hand-over time (' + describeSeconds(ho) + ') is not before the end time (' + describeSeconds(endS) +
          '): chemistry stops before the hand-over, so the mesoscopic stage never runs.');
      }
      const side = inBase(cfg.halfBox, 'length'), vox = inBase(cfg.voxel, 'length');
      if (side > 0 && vox > 0 && UNITS.length[cfg.halfBox.unit] && UNITS.length[cfg.voxel.unit]) {
        const p = pixelCount(2 * side, vox);
        if (p.capped) {
          add('voxel', 'info', 'The mesh is capped at ' + MAX_PIXELS + ' cells per side, so cells will be ' +
            fmt(+(2 * side / MAX_PIXELS / 1e-9).toPrecision(4)) + ' nm instead of the requested ' + fmt(vox / 1e-9) + ' nm (expected for the default 1 mm box; see ADR 0006).');
        }
      }
    } else if (mesoCustomized(cfg)) {
      const resolutions = [{ label: 'Discard the mesoscopic settings (restore defaults)', patch: clone(MESO_DEFAULTS) }];
      resolutions.push(cfg.model === 'SBS' ? { label: 'Use IRT_syn with the mesoscopic stage', patch: { model: 'IRT_syn', meso: true } } : { label: 'Turn the mesoscopic stage back on', patch: { meso: true } });
      add('handOver', 'incompatible', 'Mesoscopic settings were changed, but the mesoscopic stage is off, so they would have no effect. They are not written to the macro.', resolutions);
    }
    if (cfg.binsMode === 'fixed') {
      unitOk('binWidth', cfg.binWidth, Object.keys(UNITS.time));
      if (positive('binWidth', cfg.binWidth, 'Bin width') && endS !== null) {
        const n = Math.ceil(endS / inBase(cfg.binWidth, 'time'));
        if (n > 100000) add('binWidth', 'warning', 'This gives about ' + n.toExponential(2) + ' bins up to the ' + describeSeconds(endS) + ' end time; the bin table is built in memory before the run. Use a wider bin or explicit edges.');
      }
    } else if (cfg.binsMode === 'list') {
      unitOk('binList', cfg.binList, Object.keys(UNITS.time));
      const tokens = String(cfg.binList.values).trim().split(/\s+/).filter(Boolean);
      if (!tokens.length) add('binList', 'incomplete', 'Enter at least one bin edge.');
      const bad = tokens.filter(function (t) { return num(t).value === undefined; });
      if (bad.length) add('binList', 'invalid', '"' + bad[0] + '" is not a valid edge value.');
      else if (tokens.some(function (t) { return num(t).value <= 0; })) add('binList', 'warning', 'Edges at or below 0 never receive a reaction.');
    }

    // Environment
    unitOk('halfBox', cfg.halfBox, Object.keys(UNITS.length));
    positive('halfBox', cfg.halfBox, 'Half side');
    if (cfg.o2) {
      unitOk('o2Value', cfg.o2Value, O2_UNITS);
      const n = num(cfg.o2Value.value);
      if (n.empty) add('o2Value', 'incomplete', 'O2 concentration is required.');
      else if (n.bad) add('o2Value', 'invalid', 'O2 concentration: "' + cfg.o2Value.value + '" is not a number.');
      else if (n.value < 0) add('o2Value', 'invalid', 'The O2 concentration cannot be negative.');
      else if (n.value === 0) add('o2Value', 'info', '0 means no dissolved O2 (same as not adding it).');
    }
    const ph = num(cfg.pH);
    if (ph.empty) add('pH', 'incomplete', 'pH is required (default 7).');
    else if (ph.bad) add('pH', 'invalid', 'pH: "' + cfg.pH + '" is not a number.');
    else if (RULES.pH(cfg) && phCustomized(cfg)) {
      add('pH', 'incompatible', RULES.pH(cfg).why + ' The changed pH would be inert, so it is not written.',
        [{ label: 'Reset pH to 7', patch: { pH: '7' } }, { label: 'Switch the Chemistry to PureWater', patch: { chemistry: 'PureWater' } }]);
    }

    // Beam
    if (['e-', 'proton'].indexOf(cfg.particle) < 0) add('particle', 'invalid', 'Unknown particle "' + cfg.particle + '".');
    unitOk('energy', cfg.energy, Object.keys(UNITS.energy));
    positive('energy', cfg.energy, 'Kinetic energy');
    if (cfg.killerMode === 'custom') {
      if (!killerApplies(cfg)) {
        add('killerMode', 'incompatible', RULES.killer(cfg).why + ' The custom cuts are not written.',
          [{ label: 'Use the code defaults (remove custom cuts)', patch: { killerMode: 'default' } }, { label: 'Switch the particle to e-', patch: { particle: 'e-' } }]);
      } else {
        unitOk('eLossMin', cfg.eLossMin, Object.keys(UNITS.energy));
        unitOk('eLossMax', cfg.eLossMax, Object.keys(UNITS.energy));
        const a = positive('eLossMin', cfg.eLossMin, 'Stop threshold'), b = positive('eLossMax', cfg.eLossMax, 'Abort threshold');
        if (a && b && inBase(cfg.eLossMax, 'energy') < inBase(cfg.eLossMin, 'energy')) {
          add('eLossMax', 'warning', 'The abort threshold is below the stop threshold, so events are discarded before the primary would be stopped.');
        }
      }
    }

    // Runs and output
    if (!cfg.runs.length) add('runs', 'incomplete', 'Add at least one sub-run.');
    const prefixes = {}, subdirs = {};
    cfg.runs.forEach(function (r, i) {
      const p = 'runs.' + i + '.', label = 'Sub-run ' + (i + 1);
      integer(p + 'events', r.events, 1, label + ': number of events');
      const seeds = String(r.seeds || '').trim();
      if (seeds) {
        const t = seeds.split(/\s+/);
        if (t.length < 2) add(p + 'seeds', 'invalid', label + ': give at least two seeds (Geant4 ignores a single value).');
        else if (t.some(function (s) { return !/^\d+$/.test(s); })) add(p + 'seeds', 'invalid', label + ': seeds must be whole numbers separated by spaces.');
      }
      const name = String(r.name || '').trim();
      if (r.dump === 'reset') {
        if (name && !/^[A-Za-z0-9._-]+$/.test(name)) add(p + 'name', 'invalid', label + ': the prefix may only use letters, digits, ".", "_" and "-".');
        if (prefixes[name] !== undefined) {
          add(p + 'name', 'invalid', label + ': ' + (name ? 'prefix "' + name + '"' : 'a dump without prefix') + ' was already used by sub-run ' + (prefixes[name] + 1) + '; reusing it is fatal (DuplicateDumpPrefix).');
        } else prefixes[name] = i;
        if (name === 'EndOfRun_') add(p + 'name', 'warning', label + ': "EndOfRun_" is the prefix of the automatic exit dump; choose another to avoid overwriting.');
      } else if (r.dump === 'dir') {
        if (!name) add(p + 'name', 'incomplete', label + ': enter a subfolder name.');
        else if (!/^[A-Za-z0-9._/-]+$/.test(name)) add(p + 'name', 'invalid', label + ': the subfolder may only use letters, digits, ".", "_", "-" and "/".');
        else if (name.charAt(0) === '/' || name.split('/').indexOf('..') >= 0) add(p + 'name', 'invalid', label + ': the subfolder must be relative and must not contain "..".');
        else if (subdirs[name] !== undefined) add(p + 'name', 'invalid', label + ': subfolder "' + name + '" was already used by sub-run ' + (subdirs[name] + 1) + '; reusing it is fatal (DuplicateDumpSubdir).');
        else subdirs[name] = i;
      } else if (r.dump !== 'none') add(p + 'dump', 'invalid', label + ': unknown dump choice.');
    });
    if (cfg.runs.length && cfg.runs[cfg.runs.length - 1].dump === 'none') {
      add('runs.' + (cfg.runs.length - 1) + '.dump', 'info', 'The last sub-run is not dumped: its data are written at exit with the prefix EndOfRun_ (safety net).');
    }
    if (cfg.outputDirMode === 'custom') {
      const d = String(cfg.outputDir || '').trim();
      if (!d) add('outputDir', 'incomplete', 'Enter the output folder path.');
      else safeText('outputDir', d, 'The output folder path');
    }
    return issues;
  }
  function errors(issues) { return issues.filter(function (i) { return i.severity === 'error'; }); }

  function pixelCount(boxSide, target) {   // MesoSettings::PixelCount / PixelCountCapped
    let best = 1, bestDiff = Math.abs(boxSide - target);
    for (let k = 1; k <= 30; k++) {
      const n = Math.pow(2, k), d = Math.abs(boxSide / n - target);
      if (d <= bestDiff) { best = n; bestDiff = d; }
    }
    return { pixels: Math.min(best, MAX_PIXELS), capped: best > MAX_PIXELS };
  }

  // ---- filename ----
  function sanitizeFilename(name) {
    let s = String(name || '').trim().replace(/\s+/g, '_').replace(/[^A-Za-z0-9._-]/g, '');
    s = s.replace(/^[.-]+/, '');
    s = s.replace(/(\.in)+$/i, '').replace(/\.+$/, '');
    if (!s) s = 'macro';
    return s.slice(0, 120) + '.in';
  }

  // ---- generation ----
  function qty(x) { return fmt(x.value) + ' ' + x.unit; }
  function generate(cfg) {
    const lines = [];
    function c(text) { lines.push({ text: text ? '# ' + text : '#', field: null }); }
    function blank() { if (lines.length && lines[lines.length - 1].text !== '') lines.push({ text: '', field: null }); }
    function cmd(text, field) { lines.push({ text: text, field: field }); }
    const meso = mesoOn(cfg), file = sanitizeFilename(cfg.filename);
    const title = String(cfg.title || '').replace(/[\r\n]+/g, ' ').trim();

    c(title || 'dnachem-min simulation macro');
    c('Created with the dnachem-min explorer Macro builder (docs/explorer/index.html#builder).');
    c('Configuration checked against the dnachem-min source; this file has not been run.');
    c('Run from the build directory:  ./sim ' + file);
    c('Mode: ' + cfg.chemistry + ', ' + cfg.model + (meso ? ' + mesoscopic stage' : (cfg.model === 'SBS' ? '' : ', particle-based stage only')) +
      ', end time ' + describeSeconds(endTimeSeconds(cfg)) + (cfg.endTimeMode === 'custom' ? '' : ' (default)') + '.');

    const verb = [];
    if (cfg.logLevel !== 'Quiet') verb.push(['/dnaLogger/verbose ' + cfg.logLevel, 'logLevel']);
    if (String(cfg.runVerbose).trim() !== '0') verb.push(['/run/verbose ' + String(cfg.runVerbose).trim(), 'runVerbose']);
    if (String(cfg.trackingVerbose).trim() !== '0') verb.push(['/tracking/verbose ' + String(cfg.trackingVerbose).trim(), 'trackingVerbose']);
    if (verb.length) { blank(); c('Logging'); verb.forEach(function (v) { cmd(v[0], v[1]); }); }

    blank();
    c('---- Before /run/initialize (PreInit settings) ----');
    if (cfg.solvation !== 'default') { c('Electron solvation (thermalization) model'); cmd('/process/dna/e-SolvationSubType ' + cfg.solvation, 'solvation'); }
    c('Chemistry: reaction network');
    cmd('/chem/select ' + cfg.chemistry, 'chemistry');
    c('Chemistry time-step model and mesoscopic stage');
    cmd('/process/chem/TimeStepModel ' + cfg.model, 'model');
    // The user's own value, even when it conflicts (SBS + on): the preview must not
    // substitute behaviour; validation flags the line and blocks export instead.
    cmd('/chem/meso/enable ' + (cfg.meso ? 'true' : 'false'), 'meso');
    if (meso) {
      if (!sameQ(cfg.handOver, MESO_DEFAULTS.handOver)) cmd('/chem/meso/handOverTime ' + qty(cfg.handOver), 'handOver');
      if (!sameQ(cfg.voxel, MESO_DEFAULTS.voxel)) cmd('/chem/meso/voxelSize ' + qty(cfg.voxel), 'voxel');
      if (String(cfg.timesPerDecade).trim() !== MESO_DEFAULTS.timesPerDecade) cmd('/chem/meso/timesPerDecade ' + String(cfg.timesPerDecade).trim(), 'timesPerDecade');
      if (cfg.spatialOutput) { c('Per-event mesh snapshots in SpeciesMesoSpatial.h5 (large file)'); cmd('/chem/meso/spatialOutput true', 'spatialOutput'); }
    }
    if (cfg.binsMode === 'fixed') { c('Reaction-count time bins of fixed width'); cmd('/chem/reaction/timeBinsFixed ' + qty(cfg.binWidth), 'binWidth'); }
    if (cfg.binsMode === 'list') {
      c('Reaction-count time bin edges');
      cmd('/chem/reaction/timeBinsList ' + String(cfg.binList.values).trim().split(/\s+/).map(function (t) { return num(t).value === undefined ? t : fmt(t); }).join(' ') + ' ' + cfg.binList.unit, 'binList');
    }
    const env = [];
    if (!sameQ(cfg.halfBox, { value: '500', unit: 'um' })) env.push(['Water box half side (the whole geometry)', '/chem/env/halfBox ' + qty(cfg.halfBox), 'halfBox']);
    if (cfg.o2) {
      const o2 = num(cfg.o2Value.value).value;
      const note = cfg.o2Value.unit === '%' && o2 !== undefined ? ' (' + (o2 / 100 * O2_SATURATION_M).toExponential(3) + ' M)' : '';
      env.push(['Dissolved O2 bulk scavenger' + note, '/chem/env/scavenger O2 ' + fmt(cfg.o2Value.value) + ' ' + cfg.o2Value.unit, 'o2Value']);
    }
    if (phCustomized(cfg) && !RULES.pH(cfg) && num(cfg.pH).value !== undefined) env.push(['Bulk water pH', '/chem/env/pH ' + fmt(cfg.pH), 'pH']);
    env.forEach(function (e) { c(e[0]); cmd(e[1], e[2]); });
    if (cfg.outputDirMode === 'custom') { c('Output folder (launching with a different --dir is fatal)'); cmd('/run/outputDir ' + String(cfg.outputDir).trim(), 'outputDir'); }

    blank();
    cmd('/run/initialize', null);

    blank();
    c('---- After /run/initialize ----');
    if (cfg.endTimeMode === 'custom') {
      c('Chemistry end time (overrides the ' + (meso ? '1 s' : '1 us') + ' mode default)');
      cmd('/scheduler/endTime ' + qty(cfg.endTime), 'endTime');
    }
    c('Beam: starts at (0, 0, 0) along +z (fixed in PrimaryGeneratorAction)');
    cmd('/gun/particle ' + cfg.particle, 'particle');
    cmd('/gun/energy ' + qty(cfg.energy), 'energy');
    if (cfg.killerMode === 'custom' && killerApplies(cfg)) {
      c('Primary-electron energy cuts (code defaults 500 keV / 1 MeV)');
      cmd('/primaryKiller/eLossMin ' + qty(cfg.eLossMin), 'eLossMin');
      cmd('/primaryKiller/eLossMax ' + qty(cfg.eLossMax), 'eLossMax');
    }

    cfg.runs.forEach(function (r, i) {
      const p = 'runs.' + i + '.';
      blank();
      c('---- Sub-run ' + (i + 1) + ' ----');
      const seeds = String(r.seeds || '').trim().split(/\s+/).filter(Boolean).join(' ');
      if (seeds) cmd('/random/setSeeds ' + seeds, p + 'seeds');
      cmd('/run/beamOn ' + String(r.events).trim(), p + 'events');
      const name = String(r.name || '').trim();
      if (r.dump === 'reset') cmd('/run/dumpDataAndReset' + (name ? ' ' + name : ''), p + 'name');
      else if (r.dump === 'dir') cmd('/run/dumpDataAndResetToDir ' + name, p + 'name');
      else c('No dump here: results keep accumulating into the next dump.');
    });

    const text = lines.map(function (l) { return l.text; }).join('\n') + '\n';
    return { text: text, lines: lines };
  }

  // ---- summary (shared by the preview and the review step) ----
  function summary(cfg) {
    const meso = mesoOn(cfg);
    const events = cfg.runs.reduce(function (a, r) { const n = Number(String(r.events).trim()); return a + (isFinite(n) ? n : 0); }, 0);
    const dumps = cfg.runs.filter(function (r) { return r.dump !== 'none'; }).length;
    return [
      ['Chemistry', cfg.chemistry],
      ['Time-step model', cfg.model + (meso ? ' + mesoscopic stage' : ', no mesoscopic stage')],
      ['End time', describeSeconds(endTimeSeconds(cfg)) + (cfg.endTimeMode === 'custom' ? '' : ' (default)')],
      ['Water box', 'half side ' + qty(cfg.halfBox) + (cfg.o2 ? ', O2 ' + cfg.o2Value.value + ' ' + cfg.o2Value.unit : ', no O2')],
      ['Beam', cfg.particle + ', ' + cfg.energy.value + ' ' + cfg.energy.unit],
      ['Runs', cfg.runs.length + ' sub-run' + (cfg.runs.length === 1 ? '' : 's') + ', ' + events + ' event' + (events === 1 ? '' : 's') + ', ' + dumps + ' dump' + (dumps === 1 ? '' : 's')]
    ];
  }

  // A quick smoke-test preset (CLAUDE.md Testing: 10 keV e-, beamOn 2, 1 ms end time).
  function smokePreset(cfg) {
    return applyPatch(cfg, { endTimeMode: 'custom', endTime: { value: '1', unit: 'ms' }, particle: 'e-', energy: { value: '10', unit: 'keV' },
      runs: [{ events: '2', seeds: '', dump: 'reset', name: '' }] });
  }
  function changedCount(cfg) {
    const d = defaults();
    return Object.keys(d).filter(function (k) { return k !== 'filename' && JSON.stringify(d[k]) !== JSON.stringify(cfg[k]); }).length;
  }

  return {
    STEPS: STEPS, FIELDS: FIELDS, FIELD: FIELD, UNITS: UNITS, O2_UNITS: O2_UNITS, CHEMISTRIES: CHEMISTRIES, RULES: RULES,
    defaults: defaults, normalize: normalize, applyPatch: applyPatch, get: get, validate: validate, errors: errors,
    generate: generate, summary: summary, sanitizeFilename: sanitizeFilename, fieldAvailability: fieldAvailability,
    optionAvailability: optionAvailability, visible: visible, mesoOn: mesoOn, endTimeSeconds: endTimeSeconds,
    describeSeconds: describeSeconds, smokePreset: smokePreset, changedCount: changedCount, pixelCount: pixelCount
  };
}));

</script>

s","summary":"The physical stage: how electrons slow down and ionise water.","nodes":[{"id":"physics-list","title":"PhysicsList","role":"Combines DNA physics and chemistry","summary":"A simplified modular list that combines the Geant4-DNA electromagnetic physics (option 2) with the project's chemistry. IRT_syn is the default chemistry time-step model.","files":["src/physics/PhysicsList.cc","header/physics/PhysicsList.hh"],"symbols":["PhysicsList"],"review":true}],"otherFiles":[]},{"id":"geometry","title":"Geometry and environment","summary":"The single homogeneous water box and the dissolved substances in it.","nodes":[{"id":"detector","title":"DetectorConstruction","role":"Builds the water box","summary":"Builds the one water box (the whole geometry) and registers the PrimaryKiller scorer. Half-side set by /chem/env/halfBox (default 500 um).","files":["src/geometry/DetectorConstruction.cc","header/geometry/DetectorConstruction.hh"],"symbols":["DetectorConstruction::Construct","ConstructSDandField"]},{"id":"chem-world","title":"DnaChemistryWorld","role":"Describes the water: pH, scavengers","summary":"Describes the chemical environment: box size, pH and exogenous scavengers (such as dissolved O2) that react through the selected Chemistry's bulk reactions.","files":["src/geometry/DnaChemistryWorld.cc","header/geometry/DnaChemistryWorld.hh"],"symbols":["DnaChemistryWorld"],"review":true},{"id":"scavenger-msg","title":"Scavenger spec and messenger","role":"Reads scavenger settings","summary":"Parses /chem/env/scavenger values (M, mM, uM, or % for O2) into a validated specification.","files":["src/geometry/ScavengerSpec.cc","header/geometry/ScavengerSpec.hh","src/geometry/ScavengerMessenger.cc","header/geometry/ScavengerMessenger.hh"],"symbols":["ScavengerSpec"]}],"otherFiles":[]},{"id":"chemistry","title":"Chemistry","summary":"The chemical stages: what species exist, which reactions occur, and how time advances.","nodes":[{"id":"chem-list","title":"DnaChemistryList"," (function () {
  'use strict';
  const SVGNS = 'http://www.w3.org/2000/svg';

  const detail = document.getElementById('detail');
  const tabsEl = document.getElementById('tabs');
  const main = document.querySelector('main');
  document.querySelector('.skip').addEventListener('click', function (ev) {
    ev.preventDefault();
    const target = narrow.matches && main.classList.contains('inspecting') ? detail.querySelector('h2') : stage;
    target.focus(); target.scrollIntoView({ block: 'nearest' });
  });
  let mapQuery = '';
  let overviewY = 0;
  // Opened from disk: links are relative to docs/explorer/index.html (repo files two levels up).
  // Served over http(s), e.g. GitHub Pages publishing only docs/: links open the file on GitHub (main).
  const REPO_WEB = 'https://github.com/rtonneau/dnachem-min/blob/main/';
  const REPO = location.protocol === 'file:' ? '../../' : REPO_WEB;
  const narrow = window.matchMedia('(max-width: 900px)');

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) {
      if (attrs[k] === undefined || attrs[k] === null || attrs[k] === false) continue;
      if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    }
    for (const c of children || []) if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    return e;
  }
  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
    return e;
  }
  function onActivate(node, fn) {
    node.addEventListener('click', fn);
    if (node.tagName !== 'BUTTON') {
      node.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fn(); }
      });
    }
  }
  function flagEl() {
    return el('span', { class: 'flag', title: 'Summary awaiting physics review' },
      [el('span', { 'aria-hidden': 'true', text: '⚑' }), el('span', { class: 'sr-only', text: 'Summary awaiting physics review' })]);
  }

  // ---- indexes (computed from the JSON; nothing here is curated) ----
  const nodeById = {}, laneOfNode = {}, laneById = {}, nodesOfFile = {};
  DATA.lanes.forEach(function (lane) {
    laneById[lane.id] = lane;
    lane.nodes.forEach(function (n) {
      nodeById[n.id] = n; laneOfNode[n.id] = lane;
      (n.files || []).forEach(function (f) { (nodesOfFile[f] = nodesOfFile[f] || []).push(n.id); });
    });
  });
  const stepById = {}, taskById = {}, phaseById = {};
  DATA.flow.forEach(function (s, i) { s.index = i; stepById[s.id] = s; });
  DATA.tasks.forEach(function (t) { taskById[t.id] = t; });
  (DATA.phases || []).forEach(function (p) { phaseById[p.id] = p; });
  const usesOf = {}, usedBy = {};
  (DATA.edges || []).forEach(function (e) {
    (usesOf[e.from] = usesOf[e.from] || []).push(e.to);
    (usedBy[e.to] = usedBy[e.to] || []).push(e.from);
  });
  function nodesForFiles(files) {
    const out = [];
    (files || []).forEach(function (f) { (nodesOfFile[f] || []).forEach(function (id) { if (out.indexOf(id) < 0) out.push(id); }); });
    return out;
  }
  function stepsForNode(id) {
    return DATA.flow.filter(function (s) { return nodesForFiles(s.files).indexOf(id) >= 0; });
  }
  function tasksForNode(id) {
    return DATA.tasks.filter(function (t) { return nodesForFiles(t.files).indexOf(id) >= 0; });
  }
  function stepNumber(s) { const m = /^(\d+)\.\s*/.exec(s.title); return m ? m[1] : String(s.index + 1); }
  function stepTitle(s) { return s.title.replace(/^\d+\.\s*/, ''); }

  // ---- file and doc lists ----
  function humanize(slug) { const s = slug.replace(/[-_]+/g, ' '); return s.charAt(0).toUpperCase() + s.slice(1); }
  function describePath(p) {
    const file = p.split('#')[0];
    const parts = file.split('/');
    const base = parts.pop();
    const dir = parts.join('/');
    let m;
    // sub: the muted second line (full path for documents, folder for code and macros)
    const folder = dir ? dir + '/' : '(repository root)';
    if ((m = /^docs\/adr\/(\d{4})-(.+)\.md$/.exec(file))) return { kind: 'ADR ' + m[1], name: humanize(m[2]), sub: file };
    if ((m = /^docs\/recipes\/(.+)\.md$/.exec(file))) return { kind: 'Recipe', name: humanize(m[1]), sub: file };

    bui.confirm.textContent = '';

        'Configuration valid for the current code' + (warnCount ? ' (' + warnCount + ' warning' + (warnCount > 1 ? 's' : '') + ')' : '') + '. Not a simulation run: the macro has not been executed.' }));
    bui.summary.textContent = '';
    MB.summary(bcfg).forEach(function (row) { bui.summary.append(el('dt', { text: row[0] }), el('dd', { text: row[1] })); });

  // Re-render the current step, keeping keyboard focus and the text caret.

    }
    if (!key && active && bui.steps.contains(active) && active.dataset.bkey) key = active.dataset.bkey;

    else MB.FIELDS.filter(function (f) { return f.step === s.id; }).forEach(function (f) { const n = renderField(f); if (n) panel.appendChild(n); });

  function whyBlock(a, fieldId) {

  function downloadMacro() {

  function saveMacroToFolder() {
    if (MB.errors(MB.validate(bcfg)).length) return;
    const name = MB.sanitizeFilename(bcfg.filename);
    const text = MB.generate(bcfg).text;
    window.showSaveFilePicker({ suggestedName: name, types: [{ description: 'Geant4 macro', accept: { 'text/plain': ['.in'] } }] })
      .then(function (handle) {
        return handle.createWritable().then(function (w) { return w.write(text).then(function () { return w.close(); }); })
          .then(function () { bExportNote = 'Saved ' + handle.name + ' in the folder you chose.' + (handle.name !== name ? ' The comment inside still says "./sim ' + name + '".' : ''); });
      })
      .catch(function (e) { bExportNote = e && e.name === 'AbortError' ? 'Save cancelled; nothing was written.' : 'Could not save (' + (e && e.message || e) + '). Use Download instead.'; })
      .then(function () { bpendingFocus = 'export:save'; refreshBuilder(); announce(bExportNote); });
  }

  // ---- views, tabs and routing (#view or #view/id; the back button works) ----
  const VIEWS = [
    { id: 'map', label: 'Module map', render: renderMap, select: selectMap },
    { id: 'flow', label: 'Run flow', render: renderFlow, select: selectFlow },
    { id: 'tasks', label: 'Tasks', render: renderTasks, select: selectTask },
    { id: 'builder', label: 'Macro builder', render: renderBuilder, select: selectBuilder }
  ];
  const lastSel = {};
  let current = null;
  let userAction = false;
  let serial = Date.now(), currentKey = null, activeHash = null;
  const visits = new Map();
  function viewLabel(view) { return ({ map: 'Module map', flow: 'Run flow', tasks: 'Tasks', builder: 'Macro builder' })[view] || 'view'; }
  function selectionLabel() {
    const id = lastSel[current];
    const item = current === 'map' ? (nodeById[id] || laneById[(id || '').slice(5)]) : current === 'flow' ? stepById[id] :
      current === 'builder' ? builderStepById[id] : taskById[id];
    return item ? item.title.replace(/^\d+\.\s*/, '') : viewLabel(current);
  }
  function rememberVisit() {
    if (currentKey === null) return;
    visits.set(currentKey, { y: window.scrollY, detailY: detail.scrollTop, query: mapQuery,
      inspecting: main.classList.contains('inspecting'), overviewY: overviewY, connectionsOnly: connectionsOnly,
      focus: document.activeElement && document.activeElement.dataset.focus });
  }
  function go(view, id, fromUser) {
    rememberVisit();
    userAction = !!fromUser;
    const h = '#' + view + (id ? '/' + encodeURIComponent(id) : '');
    if (location.hash !== h) {
      history.pushState({ explorer: true, key: ++serial, previous: selectionLabel() }, '', h);
    }
    route(false);
  }
  function route(restoring) {
    const m = /^#([a-z]+)(?:\/(.+))?$/.exec(location.hash);
    let view = m && VIEWS.some(function (v) { return v.id === m[1]; }) ? m[1] : 'map';
    let id = null;
    try { id = m && m[2] ? decodeURIComponent(m[2]) : null; } catch (e) { /* Invalid deep link: show overview. */ }
    if (id && !(view === 'map' ? nodeById[id] || (id.indexOf('lane:') === 0 && laneById[id.slice(5)]) : view === 'flow' ? stepById[id] :
      view === 'builder' ? builderStepById[id] : taskById[id])) id = null;
    if (!history.state || !history.state.explorer) history.replaceState({ explorer: true, key: ++serial }, '');
    const saved = restoring && visits.get(history.state.key);
    const fromDetail = detail.contains(document.activeElement);
    if (saved) { mapQuery = saved.query; connectionsOnly = saved.connectionsOnly; }
    const v = VIEWS.filter(function (x) { return x.id === view; })[0];
    const switched = current !== view;
    const retainingSelection = !userAction && id === lastSel[view];
    if (switched || (saved && mapState && mapState.input.value !== mapQuery)) {
      current = view;
      VIEWS.forEach(function (x) {
        const on = x.id === view;
        x.btn.setAttribute('aria-selected', on ? 'true' : 'false');
        x.btn.tabIndex = on ? 0 : -1;
      });
      stage.setAttribute('aria-labelledby', 'tab-' + view);
      // The builder shows its guide and its live preview together; the preview
      // changes on every keystroke, so it announces only a debounced status.
      main.classList.toggle('building', view === 'builder');
      main.classList.remove('show-preview');
      detail.setAttribute('aria-live', view === 'builder' ? 'off' : 'polite');
      detail.setAttribute('aria-label', view === 'builder' ? 'Macro preview' : 'Details');
      if (view !== 'builder') bui = null;
      if (mapState && mapState.observer) mapState.observer.disconnect();
      mapState = null;
      v.render();
      stage.querySelectorAll('button, input, [role=button]').forEach(function (e, i) { e.dataset.focus = 'stage-' + view + '-' + i; });
    }
    const externalSelection = !userAction && id !== lastSel[view];
    lastSel[view] = id;
    if (!main.classList.contains('inspecting')) overviewY = window.scrollY;
    main.classList.toggle('inspecting', view !== 'builder' && (saved ? saved.inspecting : !!id && (userAction || restoring || currentKey === null)));
    v.select(id, !saved && !narrow.matches && (switched || fromDetail || externalSelection), !!saved || retainingSelection);
    currentKey = history.state.key;
    activeHash = location.hash;
    if (view === 'builder' && !saved) {
      // Moving between steps puts focus on the new step's heading (or on the
      // setting a review link pointed at, handled by renderStepPanel).
      if (!switched && userAction && !bui.panel.contains(document.activeElement)) {
        const h = bui.panel.querySelector('h3');
        h.focus({ preventScroll: true });
        bui.panel.scrollIntoView({ block: 'start' });
      } else if (switched) window.scrollTo(0, 0);
    } else if (saved) {
      overviewY = saved.overviewY;
      window.scrollTo(0, saved.y);
      detail.scrollTop = saved.detailY;
      const focused = saved.focus && document.querySelector('[data-focus="' + saved.focus + '"]');
      if (focused) focused.focus({ preventScroll: true });
    } else if (id && externalSelection && view === 'map' && !narrow.matches) {
      // A new URL selection belongs to the map, even if the previous explanation
      // held focus. Saved history and explicit detail links keep their own focus.
      const target = id.indexOf('lane:') === 0 ? mapState.laneEls[id.slice(5)].querySelector('.lane-head') :
        connectionsOnly ? mapState.focusedEls['sel:' + id] : mapState.nodeEls[id];
      target.focus({ preventScroll: true });
      if (connectionsOnly && nodeById[id]) mapState.network.scrollIntoView({ block: 'start' });
    } else if (id && (fromDetail || (narrow.matches && main.classList.contains('inspecting')))) {
      detail.querySelector('h2').focus({ preventScroll: true });
      if (narrow.matches) window.scrollTo(0, 0);
      else if (fromDetail && getComputedStyle(detail).position === 'static') detail.querySelector('h2').scrollIntoView({ block: 'start' });
    } else if (switched && (!id || narrow.matches)) window.scrollTo(0, 0);
    userAction = false;
  }
  VIEWS.forEach(function (v, i) {
    v.btn = el('button', { role: 'tab', type: 'button', id: 'tab-' + v.id, 'data-focus': 'tab-' + v.id, 'aria-controls': 'stage', text: v.label });
    v.btn.addEventListener('click', function () { go(v.id, lastSel[v.id] || null, false); });
    v.btn.addEventListener('keydown', function (ev) {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      let j = null;
      if (ev.key === 'ArrowRight') j = (i + 1) % VIEWS.length;
      if (ev.key === 'ArrowLeft') j = (i + VIEWS.length - 1) % VIEWS.length;
      if (ev.key === 'Home') j = 0;
      if (ev.key === 'End') j = VIEWS.length - 1;
      if (j !== null) { ev.preventDefault(); VIEWS[j].btn.focus(); go(VIEWS[j].id, lastSel[VIEWS[j].id] || null, false); }
    });
    tabsEl.appendChild(v.btn);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' || ev.defaultPrevented) return;
    if (current === 'builder') {
      if (bconfirm) { bconfirm = null; bpendingFocus = 'tool:reset'; refreshBuilder(); }
      return;
    }
    if (ev.target && ev.target.tagName === 'INPUT' && ev.target.type !== 'radio') return;
    if (narrow.matches && main.classList.contains('inspecting')) { returnToView(); return; }
    if (current === 'map' && connectionsOnly && lastSel.map && detail.contains(document.activeElement) && getComputedStyle(detail).position === 'static') { returnToView(); return; }
    if (lastSel[current]) { go(current, null, false); stage.focus(); }
  });
  history.scrollRestoration = 'manual';
  window.addEventListener('popstate', function () { rememberVisit(); route(true); });
  window.addEventListener('hashchange', function () {
    if (activeHash !== location.hash) { rememberVisit(); route(true); }
  });
  window.addEventListener('resize', drawEdges);
  if (window.ResizeObserver) new ResizeObserver(function (entries) {
    document.documentElement.style.setProperty('--header-height', entries[0].target.offsetHeight + 'px');
  }).observe(document.querySelector('header'));
  // Crossing the breakpoint can hide details before the media-query callback,
  // which blurs their focused control. Remember it while it is still visible.
  let focusedDetail = null;
  document.addEventListener('focusin', function (ev) {
    if (ev.target !== document.body) focusedDetail = detail.contains(ev.target) ? ev.target : null;
  });
  narrow.addEventListener('change', function () {
    if (!narrow.matches) main.classList.remove('inspecting');
    else if (focusedDetail && focusedDetail.isConnected && lastSel[current]) {
      main.classList.add('inspecting');
      focusedDetail.focus({ preventScroll: true });
    }
    drawEdges();
  });
  route(false);

  window.Explorer = { DATA: DATA, go: go };
})();
</script>
</body>
</html>
