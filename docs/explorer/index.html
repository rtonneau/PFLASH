<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dnachem-min architecture explorer</title>
<style>
  :root { --bg:#f7f8fa; --fg:#1d2330; --muted:#5b6475; --line:#b9c0cc; --card:#fff;
          --accent:#1f6feb; --review:#c27800; --sel:#e6f0ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px 0; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { margin:0 0 2px; font-size:20px; }
  header p { margin:0 0 10px; color:var(--muted); }
  nav { display:flex; gap:4px; }
  nav button { border:1px solid var(--line); border-bottom:none; background:#eef0f4; padding:7px 16px;
               border-radius:6px 6px 0 0; font:inherit; cursor:pointer; color:var(--fg); }
  nav button[aria-selected="true"] { background:var(--bg); font-weight:600; color:var(--accent); }
  main { display:flex; align-items:flex-start; }
  #stage { flex:1; overflow:auto; padding:16px; min-width:0; }
  #detail { width:380px; flex:none; position:sticky; top:0; max-height:100vh; overflow:auto;
            background:var(--card); border-left:1px solid var(--line); padding:16px 18px; }
  #detail.empty { color:var(--muted); }
  .lane-title { font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:.04em; fill:var(--muted); }
  .lane-bg { fill:#fff; stroke:var(--line); }
  .node rect { fill:var(--card); stroke:var(--line); stroke-width:1.2; rx:6; }
  .node:hover rect, .node:focus rect { stroke:var(--accent); }
  .node.sel rect { fill:var(--sel); stroke:var(--accent); stroke-width:2; }
  .node.review rect { stroke:var(--review); stroke-dasharray:4 3; }
  .node text { font-size:12.5px; fill:var(--fg); pointer-events:none; }
  .node { cursor:pointer; outline:none; }
  .edge { fill:none; stroke:#9aa4b5; stroke-width:1.2; opacity:.55; }
  .edge.hi { stroke:var(--accent); opacity:1; stroke-width:2; }
  h2 { margin:0 0 6px; font-size:18px; }
  h3 { margin:16px 0 4px; font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  details { margin-top:14px; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fafbfc; }
  summary { cursor:pointer; font-weight:600; }
  ul.files { list-style:none; padding:0; margin:8px 0 0; }
  ul.files li { display:flex; gap:6px; align-items:center; margin:3px 0; }
  ul.files a { color:var(--accent); word-break:break-all; font:12.5px ui-monospace, Consolas, monospace; }
  button.copy { border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; font-size:11px; padding:1px 6px; }
  code { font:12.5px ui-monospace, Consolas, monospace; background:#eef0f4; padding:1px 4px; border-radius:3px; }
  .badge { display:inline-block; background:#fff3d6; color:var(--review); border:1px solid #f0d28a;
           border-radius:10px; padding:1px 8px; font-size:12px; margin-bottom:6px; }
  .placeholder { color:var(--muted); padding:30px 10px; }
  .flow { display:flex; flex-direction:column; gap:10px; max-width:980px; }
  .step, .task { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 14px; cursor:pointer; }
  .step { display:flex; gap:16px; justify-content:space-between; }
  .step:hover, .task:hover, .step:focus, .task:focus { border-color:var(--accent); outline:none; }
  .step.sel, .task.sel { background:var(--sel); border-color:var(--accent); }
  .step.review { border-style:dashed; border-color:var(--review); }
  .step-title { font-weight:600; }
  .step-sum { color:var(--muted); font-size:14px; }
  .branches { margin-top:8px; display:grid; gap:4px; }
  .branch { font-size:13.5px; padding:4px 8px; background:#f1f4f9; border-left:3px solid var(--accent); border-radius:3px; }
  .outs { display:flex; flex-direction:column; gap:4px; align-items:flex-end; flex:none; max-width:260px; }
  .out { font:12px ui-monospace, Consolas, monospace; background:#eef7ee; border:1px solid #b9dcb9; border-radius:10px; padding:1px 8px; }
  .tasks { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; max-width:980px; }
  .legend { font-size:12.5px; color:var(--muted); margin:0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>dnachem-min architecture explorer</h1>
  <p>Click a box to see what it does, in plain language, and where it lives in the code.</p>
  <nav role="tablist" id="tabs"></nav>
</header>
<main>
  <section id="stage" role="tabpanel"></section>
  <aside id="detail" class="empty" aria-live="polite">Select a box to see its description.</aside>
</main>

ctions/Run.hh"],"symbols":["RunAction::BeginOfRunAction","RunAction::EndOfRunAction","Run::Merge"]},{"id":"event-action","title":"EventAction","summary":"Per-event bookkeeping: stages pre-chemical files and commits the track-length row for events that were not aborted.","files":["src/actions/EventAction.cc","header/actions/EventAction.hh"],"symbols":["EventAction"]},{"id":"tracking-action","title":"TrackingAction","summary":"After each track, fills the event's track-length row: primary track length and how it ended (stopped, escaped or killed), plus secondary-electron lengths.","files":["src/actions/TrackingAction.cc","header/actions/TrackingAction.hh"],"symbols":["TrackingAction::PostUserTrackingAction"]},{"id":"stepping-action","title":"SteppingAction","summary":"Counts each discrete Geant4-DNA physical interaction (excluding transport) by process name.","files":["src/actions/SteppingAction.cc","header/actions/SteppingAction.hh"],"symbols":["SteppingAction"]},{"id":"stacking-action","title":"StackingAction","summary":"When the physical stage has no tracks left, starts the chemistry for the event (the hand-off from physics to chemistry) and logs the stage change.","files":["src/actions/StackingAction.cc","header/actions/StackingAction.hh"],"symbols":["StackingAction::NewStage"]}],"otherFiles":[]},{"id":"physics","title":"Physics","summary":"The physical stage: how electrons slow down and ionise water.","nodes":[{"id":"physics-list","title":"PhysicsList","summary":"A simplified modular list that combines the Geant4-DNA electromagnetic physics (option 2) with the project's chemistry. IRT_syn is the default chemistry time-step model.","files":["src/physics/PhysicsList.cc","header/physics/PhysicsList.hh"],"symbols":["PhysicsList"],"review":true}],"otherFiles":[]},{"id":"geometry","title":"Geometry and environment","summary":"The single homogeneous water box and the dissolved substances in it.","nodes":[{"id":"detector","title":"DetectorConstruction","summary":"Builds the one water box (the whole geometry) and registers the PrimaryKiller scorer. Half-side set by /chem/env/halfBox (default 500 um).","files":["src/geometry/DetectorConstruction.cc","header/geometry/DetectorConstruction.hh"],"symbols":["DetectorConstruction::Construct","ConstructSDandField"]},{"id":"chem-world","title":"DnaChemistryWorld","summary":"Describes the chemical environment: box size, pH and exogenous scavengers (such as dissolved O2) that react through the selected Chemistry's bulk reactions.","files":["src/geometry/DnaChemistryWorld.cc","header/geometry/DnaChemistryWorld.hh"],"symbols":["DnaChemistryWorld"],"review":true},{"id":"scavenger-msg","title":"Scavenger spec and messenger","summary":"Parses /chem/env/scavenger values (M, mM, uM, or % for O2) into a validated specification.","files":["src/geometry/ScavengerSpec.cc","header/geometry/ScavengerSpec.hh","src/geometry/ScavengerMessenger.cc","header/geometry/ScavengerMessenger.hh"],"symbols":["ScavengerSpec"]}],"otherFiles":[]},{"id":"chemistry","title":"Chemistry","summary":"The chemical stages: what species exist, which reactions occur, and how time advances.","nodes":[{"id":"chem-list","title":"DnaChemistryList","summary":"The driver of the chemical stage: defines the molecules, water dissociation channels, reaction table and time-step model (IRT_syn default, or SBS). Registers bulk reactions as scavenger processes.","files":["src/chemistry/DnaChemistryList.cc","header/chemistry/DnaChemistryList.hh"],"symbols":["DnaChemistryList","CheckTimeStepModel"],"review":true},{"id":"time-step","title":"TimeStepAction","summary":"Runs the particle-based stage and, in IRT_syn with the mesoscopic stage on, hands the remaining molecules over at the Hand-over time to the mesoscopic stage (Gillespie on a cell mesh).","files":["src/chemistry/TimeStepAction.cc","header/chemistry/TimeStepAction.hh"],"symbols":["TimeStepAction"],"review":true},{"id":"meso-settings","title":"MesoSettings","summary":"Portable settings for nter.cc","header/scoring/MesoSpeciesCounter.hh"],"symbols":["MesoSpeciesCounter"]},{"id":"meso-spatial","title":"MesoSpatialFile","summary":"HDF5 writer for per-event spatial snapshots of the mesoscopic mesh.","files":["src/scoring/MesoSpatialFile.cc","header/scoring/MesoSpatialFile.hh"],"symbols":["MesoSpatialFile::AppendEvent"]},{"id":"track-length","title":"TrackLengthTable","summary":"One row per event with the primary track length, end reason and secondary-electron lengths.","files":["src/scoring/TrackLengthTable.cc","header/scoring/TrackLengthTable.hh"],"symbols":["TrackLengthTable"]},{"id":"primary-killer","title":"PrimaryKiller","summary":"Scorer that kills the primary electron after a configured energy loss and kills tracks leaving a bounding box.","files":["src/scoring/PrimaryKiller.cc","header/scoring/PrimaryKiller.hh"],"symbols":["PrimaryKiller"]},{"id":"accumulator","title":"RunAccumulator","summary":"Process-wide accumulator that keeps energy deposit, counters and run entries across /run/beamOn calls until a dump.","files":["src/scoring/RunAccumulator.cc","header/scoring/RunAccumulator.hh"],"symbols":["RunAccumulator"]},{"id":"dump-msg","title":"RunAccumulatorMessenger","summary":"Provides /run/dumpDataAndReset and the exit-time safety-net flush.","files":["src/scoring/RunAccumulatorMessenger.cc","header/scoring/RunAccumulatorMessenger.hh"],"symbols":["RunAccumulatorMessenger","FlushIfPending"]},{"id":"manifest","title":"RunManifest","summary":"Builds Manifest.json for each dump (beam, seed, chemistry, environment, files).","files":["src/scoring/RunManifest.cc","header/scoring/RunManifest.hh","src/scoring/ResultsIndex.cc","header/scoring/ResultsIndex.hh"],"symbols":["RunManifest::RecordRun","RunManifest::Write"]},{"id":"json","title":"DataNode and JsonWriter","summary":"Portable output tree and the JSON serialiser that writes it.","files":["src/scoring/DataNode.cc","header/scoring/DataNode.hh","src/scoring/JsonWriter.cc","header/scoring/JsonWriter.hh"] id-base-buffer.md","docs/adr/0003-clustered-source-layout.md","docs/adr/0004-scavenger-reactions-per-chemistry.md"],"files":[]}]};

(function () {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const stage = document.getElementById('stage');
  const detail = document.getElementById('detail');
  const tabsEl = document.getElementById('tabs');
  // Links are relative to docs/explorer/index.html; repo files sit two levels up.
  const REPO = '../../';

  function el(tag, attrs, children) {
    const e = document.createElement(tag);
    for (const k in (attrs || {})) {
      if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    }
    for (const c of children || []) e.appendChild(c);
    return e;
  }
  function svg(tag, attrs) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ---- detail panel (shared by all views) ----
  function fileList(files) {
    const ul = el('ul', { class: 'files' });
    for (const f of files) {
      const path = f.split('#')[0];
      const a = el('a', { href: REPO + f, text: f, target: '_blank', rel: 'noopener' });
      const btn = el('button', { class: 'copy', type: 'button', text: 'copy', title: 'Copy path' });
      btn.addEventListener('click', function () {
        const done = function () { btn.textContent = 'copied'; setTimeout(function () { btn.textContent = 'copy'; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(path).then(done, done);
        else done();
      });
      ul.appendChild(el('li', {}, [btn, a]));
    }
    return ul;
  }
  function showDetail(item, laneTitle) {
    detail.className = '';
    detail.textContent = '';
    if (item.review) detail.appendChild(el('div', { class: 'badge', text: 'summary awaiting physics review' }));
    detail.appendChild(el('h2', { text: item.title }));
    if (laneTitle) detail.appendChild(el('div', { class: 'legend', text: laneTitle }));
    detail.appendChild(el('p', { text: item.summary }));
    const code = el('details', {});
    code.appendChild(el('summary', { text: 'Where in the code' }));
    if (item.files && item.files.length) code.appendChild(fileList(item.files));
    if (item.symbols && item.symbols.length) {
      code.appendChild(el('h3', { text: 'Key symbols' }));
      const p = el('p', {});
      item.symbols.forEach(function (s, i) {
        if (i) p.appendChild(document.createTextNode(' '));
        p.appendChild(el('code', { text: s }));
      });
      code.appendChild(p);
    }
    detail.appendChild(code);
  }

  // ---- module map ----
  const COL_W = 210, NODE_W = 186, NODE_H = 38, GAP = 12, TOP = 44, PAD = 12;

  function renderModuleMap() {
    stage.textContent = '';
    stage.appendChild(el('p', { class: 'legend', text: 'Columns are source folders. Arrows show which part uses which. Dashed orange outline: summary still awaiting physics review.' }));
    const pos = {};
    const lanes = DATA.lanes;
    let maxH = 0;
    lanes.forEach(function (lane, li) {
      lane.nodes.forEach(function (n, ni) {
        pos[n.id] = { x: li * COL_W + PAD + 4, y: TOP + ni * (NODE_H + GAP) };
      });
      maxH = Math.max(maxH, TOP + lane.nodes.length * (NODE_H + GAP));
    });
    const W = lanes.length * COL_W + PAD, H = maxH + PAD;
    const root = svg('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, role: 'group', 'aria-label': 'Module map' });

    lanes.forEach(function (lane, li) {
      root.appendChild(svg('rect', { class: 'lane-bg', x: li * COL_W + PAD / 2, y: 0, width: COL_W - 4, height: H, rx: 8 }));
      const t = svg('text', { class: 'lane-title', x: li * COL_W + PAD + 4, y: 26 });
      t.textContent = lane.title.length > 22 ? lane.title.slice(0, 21) + '…' : lane.title;
      const tt = svg('title'); tt.textContent = lane.summary;
      t.appendChild(tt);
      root.appendChild(t);
    });

    const edgeEls = [];
    (DATA.edges || []).forEach(function (e) {
      const a = pos[e.from], b = pos[e.to];
      if (!a || !b) return;
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2;
      let d;
      if (a.x < b.x) { const m = (x1 + x2) / 2; d = 'M' + x1 + ',' + y1 + ' C' + m + ',' + y1 + ' ' + m + ',' + y2 + ' ' + x2 + ',' + y2; }
      else if (a.x > b.x) { const m = (a.x + b.x + NODE_W) / 2; d = 'M' + a.x + ',' + y1 + ' C' + m + ',' + y1 + ' ' + m + ',' + y2 + ' ' + (b.x + NODE_W) + ',' + y2; }
      else { const o = NODE_W + 8; d = 'M' + x1 + ',' + y1 + ' C' + (x1 + o / 2) + ',' + y1 + ' ' + (x1 + o / 2) + ',' + y2 + ' ' + x2 + ',' + y2 + ' '; d = 'M' + (a.x + NODE_W) + ',' + y1 + ' C' + (a.x + NODE_W + 14) + ',' + y1 + ' ' + (a.x + NODE_W + 14) + ',' + y2 + ' ' + (b.x + NODE_W) + ',' + y2; }
      const p = svg('path', { class: 'edge', d: d });
      root.appendChild(p);
      edgeEls.push({ p: p, from: e.from, to: e.to });
    });

    let selected = null;
    function select(g, n, lane) {
      if (selected) selected.classList.remove('sel');
      selected = g; g.classList.add('sel');
      edgeEls.forEach(function (x) { x.p.classList.toggle('hi', x.from === n.id || x.to === n.id); });
      showDetail(n, lane.title);
    }

    lanes.forEach(function (lane) {
      lane.nodes.forEach(function (n) {
        const p = pos[n.id];
        const g = svg('g', { class: 'node' + (n.review ? ' review' : ''), tabindex: 0, role: 'button', transform: 'translate(' + p.x + ',' + p.y + ')', 'aria-label': n.title });
        g.appendChild(svg('rect', { width: NODE_W, height: NODE_H }));
        const t = svg('text', { x: 9, y: NODE_H / 2 + 4.5 });
        t.textContent = n.title.length > 27 ? n.title.slice(0, 26) + '…' : n.title;
        g.appendChild(t);
        g.addEventListener('click', function () { select(g, n, lane); });
        g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(g, n, lane); } });
        root.appendChild(g);
      });
    });
    stage.appendChild(root);
  }

  // ---- run flow ----
  function renderFlow() {
    stage.textContent = '';
    stage.appendChild(el('p', { class: 'legend', text: 'One simulation run, step by step. Click a step for the files involved; the right-hand tags are the output files it produces.' }));
    const list = el('div', { class: 'flow' });
    let selected = null;
    DATA.flow.forEach(function (s) {
      const card = el('div', { class: 'step' + (s.review ? ' review' : ''), tabindex: '0', role: 'button' });
      card.appendChild(el('div', { class: 'step-main' }, [
        el('div', { class: 'step-title', text: s.title }),
        el('div', { class: 'step-sum', text: s.summary })
      ]));
      if (s.branches && s.branches.length) {
        const br = el('div', { class: 'branches' });
        s.branches.forEach(function (b) {
          br.appendChild(el('div', { class: 'branch' }, [el('b', { text: b.label }), el('span', { text: ' ' + b.summary })]));
        });
        card.firstChild.appendChild(br);
      }
      const outs = el('div', { class: 'outs' });
      (s.outputs || []).forEach(function (o) { outs.appendChild(el('span', { class: 'out', text: o })); });
      card.appendChild(outs);
      function pick() {
        if (selected) selected.classList.remove('sel');
        selected = card; card.classList.add('sel');
        const item = { title: s.title, summary: s.summary, review: s.review, files: (s.files || []).concat(s.docs || []), symbols: [] };
        showDetail(item, 'Run flow');
      }
      card.addEventListener('click', pick);
      card.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
      list.appendChild(card);
    });
    stage.appendChild(list);
  }

  // ---- tasks ----
  function renderTasks() {
    stage.textContent = '';
    stage.appendChild(el('p', { class: 'legend', text: 'Start from what you want to do. Click a task for the guide and the files involved.' }));
    [['everyone', 'For everyone'], ['developer', 'For developers']].forEach(function (g) {
      const tasks = DATA.tasks.filter(function (t) { return t.audience === g[0]; });
      if (!tasks.length) return;
      stage.appendChild(el('h3', { text: g[1] }));
      const grid = el('div', { class: 'tasks' });
      tasks.forEach(function (t) {
        const card = el('div', { class: 'task', tabindex: '0', role: 'button' }, [
          el('div', { class: 'step-title', text: t.title }), el('div', { class: 'step-sum', text: t.summary })]);
        function pick() {
          grid.querySelectorAll('.sel').forEach(function (x) { x.classList.remove('sel'); });
          card.classList.add('sel');
          detail.className = ''; detail.textContent = '';
          detail.appendChild(el('h2', { text: t.title }));
          detail.appendChild(el('p', { text: t.summary }));
          detail.appendChild(el('h3', { text: 'Guides' }));
          detail.appendChild(fileList(t.docs || []));
          if (t.files && t.files.length) {
            const d = el('details', {}, [el('summary', { text: 'Files you touch' }), fileList(t.files)]);
            detail.appendChild(d);
          }
        }
        card.addEventListener('click', pick);
        card.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } });
        grid.appendChild(card);
      });
      stage.appendChild(grid);
    });
  }

  // ---- tabs ----
  const VIEWS = [
    { id: 'map', label: 'Module map', render: renderModuleMap },
    { id: 'flow', label: 'Run flow', render: renderFlow },
    { id: 'tasks', label: 'Tasks', render: renderTasks }
  ];
  function activate(id) {
    VIEWS.forEach(function (v) {
      v.btn.setAttribute('aria-selected', v.id === id ? 'true' : 'false');
      if (v.id === id) { detail.className = 'empty'; detail.textContent = 'Select a box to see its description.'; v.render(); }
    });
    location.hash = id;
  }
  VIEWS.forEach(function (v) {
    v.btn = el('button', { role: 'tab', type: 'button', text: v.label });
    v.btn.addEventListener('click', function () { activate(v.id); });
    tabsEl.appendChild(v.btn);
  });
  const start = location.hash.slice(1);
  activate(VIEWS.some(function (v) { return v.id === start; }) ? start : 'map');

  window.Explorer = { DATA: DATA, el: el, svg: svg, stage: stage, showDetail: showDetail, fileList: fileList, REPO: REPO };
})();
</script>
</body>
