name: docs-checks

# Lightweight checks that need no Geant4 build: the architecture explorer
# (paths, source coverage, freshness of index.html) and the macro-builder model.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node docs/explorer/check.js
      - run: node docs/explorer/macro-builder.test.js
