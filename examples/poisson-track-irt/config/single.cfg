# Single-source control history: row 1 of deterministic-schedule.txt (the track
# arriving at 0.5 ms), alone, on the record grid of the full schedule, so its
# species.csv lines up row by row with that of deterministic.cfg.
#   <build>/history --config config/single.cfg --output out/single-1
# Run with singleSource = 0, 1 and 2 for the three single-track controls; keep
# chemistrySeed independent of the deterministic history.
mode = single
libraryDir = ../library
scheduleFile = deterministic-schedule.txt
singleSource = 1
endpointNs = 3e6
chemistrySeed = 2
