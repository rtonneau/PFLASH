# Poisson shared history: arrivals at 2 kHz during a 2 ms exposure (4 tracks on
# average), placed uniformly in a 100 um box, observed to 3 ms.
#   <build>/history --config config/poisson.cfg --output out/poisson
# Packets are never reused: the library needs at least as many packets as
# arrivals (16 makes "library exhausted" very unlikely at this rate; the error
# names the arrival that found none). sourceSeed draws the arrivals,
# chemistrySeed the chemistry: they are independent.
mode = poisson
libraryDir = ../library
rateHz = 2000
exposureS = 2e-3
sourceSeed = 1
regionCenterUm = 0 0 0
regionHalfSizeUm = 50
endpointNs = 3e6
chemistrySeed = 1
