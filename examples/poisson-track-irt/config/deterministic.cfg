# Deterministic shared history (the default case): the three tracks of
# deterministic-schedule.txt in ONE IRT_syn chemistry history, observed to 3 ms.
#
# The packet library is made first, from the example directory (one library of
# 16 packets serves the three configs here):
#   <build>/capture --macro macros/capture.mac --output library --count 16 --first-seed 1001
# then, from the same directory:
#   <build>/history --config config/deterministic.cfg --output out/deterministic
# Relative paths below are relative to this file. A 3 ms history is long; ctest
# runs bounded versions of it instead.
mode = deterministic
libraryDir = ../library
scheduleFile = deterministic-schedule.txt
endpointNs = 3e6
chemistrySeed = 1
