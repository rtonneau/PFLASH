<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">dnachem-min: an electron track ionizing water</title>
  <!-- background: same teal family as the explorer badge (#0a7ea4) -->
  <rect width="128" height="128" rx="26" fill="#0b3d52"/>
  <!-- electron track: jagged path, as in a Geant4-DNA track -->
  <polyline points="10,118 26,96 20,76 38,58 31,40 52,26 76,18 118,10"
            fill="none" stroke="#7fd3f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ionization / excitation events along the track -->
  <circle cx="26" cy="96" r="6" fill="#f5b942"/>
  <circle cx="38" cy="58" r="6" fill="#f5b942"/>
  <circle cx="52" cy="26" r="6" fill="#f5b942"/>
  <!-- water molecule (H-O-H, ~104.5 degrees) -->
  <g stroke="#f2f4f5" stroke-width="7" stroke-linecap="round">
    <line x1="80" y1="84" x2="58" y2="101"/>
    <line x1="80" y1="84" x2="102" y2="101"/>
  </g>
  <circle cx="80" cy="82" r="18" fill="#e4572e"/>
  <circle cx="56" cy="103" r="11" fill="#f2f4f5"/>
  <circle cx="104" cy="103" r="11" fill="#f2f4f5"/>
  <!-- radical dot: the chemistry that follows -->
  <circle cx="98" cy="62" r="5" fill="#f5b942"/>
</svg>
